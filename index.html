/* Halloween */
html:root[data-skin="halloween"]{--bg:#120B18;--surface:#1C1326;--surface-2:#271A33;--fg:#F4EADB;--muted:#A994B8;--line:#3A2A4A;--map-base:#2A1D36;--map-muscle:#4A3360;

  --display:"Creepster","Barlow Condensed",cursive;color-scheme:dark}
html:root[data-skin="halloween"] body{background:radial-gradient(1200px 500px at 50% -10%,#3B1D52 0%,transparent 60%),radial-gradient(900px 400px at 50% 110%,#2B1406 0%,transparent 60%),var(--bg);background-attachment:fixed}

html:root[data-skin="halloween"] h1,html:root[data-skin="halloween"] .panel h2{font-family:var(--display);font-weight:400;letter-spacing:.04em}
html:root[data-skin="halloween"] .panel h2{color:#FFB46B}

       <circle class="eyeglow" cx="${x-3.6}" cy="14" r="1.1"/><circle class="eyeglow" cx="${x+3.6}" cy="14" r="1.1"/>`:""}
      <path d="M${x} 30V86" ${bone} stroke-width="3" stroke-dasharray="3 1.6"/>${ribs}

const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=(n)=>String(n).padStart(2,"0");
const TZ=(()=>{try{const v=JSON.parse(localStorage.getItem("ll.tz"));if(v){new Intl.DateTimeFormat("en-US",{timeZone:v});return v}}catch(e){}return null})();
const LOC=(window.LIFTLOG_I18N&&window.LIFTLOG_I18N.locale)||undefined;
function tzD(ms){const n=new Date(ms);if(!TZ)return n;try{return new Date(n.toLocaleString("en-US",{timeZone:TZ}))}catch(e){return n}}
function nowD(){return tzD(Date.now())}
const ymd=(d=nowD())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=ymd();
const fmtDate=(s)=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(LOC,{weekday:"short",month:"short",day:"numeric"})};
const r5=(x)=>Math.round(x/5)*5;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  if(it.rx) return it.rx;
  if(it.type==="cardio") return `${it.reps[0]} min`;
  const r=it.reps[0]===it.reps[1]?`${it.reps[0]}`:`${it.reps[0]}–${it.reps[1]}`;
  return `${it.sets}×${r}${it.each?" each side":""}`;
};
/* ---------- units ----------
   Weights are always stored in pounds; they're shown and typed in the person's chosen unit. */
const LB_PER_KG=2.20462262;
function defaultUnits(){const l=String((navigator.languages&&navigator.languages[0])||navigator.language||"en-US");
  const m=l.match(/^[a-z]{2,3}(?:[-_][A-Za-z]{4})?[-_]([A-Za-z]{2})(?![A-Za-z])/); const region=m?m[1].toUpperCase():(/^en\b/i.test(l)?"US":"");
  return ["US","LR","MM"].includes(region)?"imperial":"metric"}
function units(){return (typeof plan!=="undefined"&&plan&&plan.units)||defaultUnits()}
const isKg=()=>units()==="metric";
const wU=()=>isKg()?"kg":"lb";
function toDisp(lb){if(lb===""||lb==null)return "";const n=Number(lb);if(isNaN(n))return "";const v=isKg()?n/LB_PER_KG:n;return Math.round(v*10)/10}
function fromDisp(v){if(v===""||v==null)return "";const n=Number(v);if(isNaN(n))return "";return isKg()?Math.round(n*LB_PER_KG*10000)/10000:n}
function rPlate(lb){return isKg()?Math.round(lb/LB_PER_KG/2.5)*2.5*LB_PER_KG:r5(lb)}
const minPlate=()=>isKg()?2.5*LB_PER_KG:5;
function setsText(sets,type){
  if(!sets||!sets.length) return "";
  if(type==="cardio") return sets[0].w?`${sets[0].w} min`:"done";
  const top=sets.filter(s=>s.r||s.w);
  if(!top.length) return "";
  return top.map(s=>(s.w?`${toDisp(s.w)}×`:"BW×")+(s.r||"?")).join(", ");
}

  Object.keys(plan.schedule).forEach(w=>{const v=plan.schedule[w];if(v===k)plan.schedule[w]=other;else if(v===other)plan.schedule[w]=k});

    const c=dayCats(k); const ranked=Object.keys(c).filter(x=>x!=="Abs").sort((a,b)=>c[b]-c[a]);
    let title=base, auto=false;

let dropPct=ls.get("ll.dropPct",20);
const DROP_CHOICES=[10,15,20,25,30];
function dropW(w,n){return rPlate(w*(1-dropPct/100*n))}
function dropsTxt(w){return w?`drops: ${toDisp(w)} → ${toDisp(dropW(w,1))} → ${toDisp(dropW(w,2))} ${wU()} (${dropPct}% each)`:""}
let dropAuto=ls.get("ll.dropAuto",true);
function autoW(w,n){if(n<=2)return Math.max(minPlate(),dropW(w,n));return Math.max(minPlate(),rPlate(autoW(w,n-1)*(1-dropPct/100)))}
function refillDrops(it,d){
  if(!it.drop||!dropAuto) return;
  d.autoIdx=d.autoIdx||[];
  const w=Number(d.sets[0]&&d.sets[0].w);
  for(let j=1;j<nSets(it,d)&&j<d.sets.length;j++){
    const isAuto=d.autoIdx.includes(j);
    if(!w){if(isAuto){d.sets[j].w="";d.autoIdx=d.autoIdx.filter(x=>x!==j)}continue}
    if(d.sets[j].w===""||isAuto){const prev=Number(d.sets[j-1].w)||autoW(w,j-1);d.sets[j].w=String(j<=2?autoW(w,j):Math.max(minPlate(),rPlate(prev*(1-dropPct/100))));if(!isAuto)d.autoIdx.push(j)}
  }
}
function setDropPct(v){v=Math.round(Number(v));if(!(v>=5&&v<=45))return false;dropPct=v;ls.set("ll.dropPct",v);return true}
function dropChips(prefix){return `<div class="dchips" role="group" aria-label="Drop size">${DROP_CHOICES.map(v=>`<button class="dchip ${v===dropPct?"on":""}" data-${prefix}="${v}" aria-pressed="${v===dropPct}">${v}%</button>`).join("")}</div>`}

function dayChanges(k){
  const swaps=Object.keys(plan.slots).filter(x=>x.startsWith(k+":")&&!x.startsWith(k+":+")).length;
  const added=(plan.extra[k]||[]).length;
  const removed=Object.keys(plan.hidden).filter(x=>x.startsWith(k+":")&&plan.hidden[x]).length;
  const reord=isReordered(k)?1:0; const setch=Object.keys(plan.sets).filter(x=>x.startsWith(k+":")).length;
  const parts=[];if(swaps)parts.push(`${swaps} swapped`);if(added)parts.push(`${added} added`);if(removed)parts.push(`${removed} removed`);if(setch)parts.push(`${setch} set count${setch===1?"":"s"} changed`);if(reord)parts.push("order changed");
  return {swaps,added,removed,total:swaps+added+removed+reord+setch,text:`${DAYS[k].label} has changes: ${parts.join(", ")}.`};
}

const timer={preset:ls.get("ll.preset",90),endAt:null,remain:null,running:false,over:false};
const fmtT=(s)=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${pad(s%60)}`};
let audioCtx=null,wake=null,tickH=null;
const NOTIFY_DEF={sound:true,vibrate:true,awake:true,banner:true};
function nPref(k){const n=(plan&&plan.notify)||{};return n[k]==null?NOTIFY_DEF[k]:!!n[k]}
function beep(){
  if(nPref("sound")) try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach((t,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=i===2?1320:880;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,audioCtx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.28);
      o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.3)})}catch(e){}
  if(nPref("vibrate")) try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}
  if(nPref("banner")&&pickTab()!=="timer") toast("⏱ Rest's over. Next set!");
}
function startTimer(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
  timer.endAt=Date.now()+timer.preset*1000;timer.running=true;timer.over=false;
  if(nPref("awake")) try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
  tick();
}
function stopTimer(){timer.running=false;timer.endAt=null;timer.over=false;try{wake&&wake.release()}catch(e){};wake=null;clearTimeout(tickH);updateTimer()}
function tick(){
  clearTimeout(tickH);
  if(timer.running){
    const left=(timer.endAt-Date.now())/1000;
    if(left<=0&&!timer.over){timer.over=true;beep();document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash")}
    if(left<=-60){stopTimer();return}
    tickH=setTimeout(tick,200);
  }
  updateTimer();
}
function updateTimer(){
  const pill=$("#pill");
  const left=timer.running?(timer.endAt-Date.now())/1000:timer.preset;
  const onTimerTab=pickTab()==="timer";
  pill.hidden=!timer.running||onTimerTab;
  if(timer.running){pill.textContent=timer.over?"Rest over · GO":"Rest "+fmtT(left);pill.classList.toggle("over",timer.over)}
  const t=$("#tread"); if(!t) return;
  t.textContent=timer.over?"GO":fmtT(left);
  $("#tstate").textContent=timer.over?"Rest's over. Next set!":timer.running?"Resting…":"Ready";
  const frac=timer.running?Math.max(0,left)/timer.preset:1;
  $("#tbar").style.strokeDashoffset=String(565.5*(1-frac));
  $("#tgo").textContent=timer.running?(timer.over?"Done":"Stop"):"Start rest";
  $(".timer").classList.toggle("over",timer.over);
  document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("on",+b.dataset.s===timer.preset));
  $("#tval").textContent=fmtT(timer.preset);
}

function fmtStamp(ms){if(!ms)return "—";const d=tzD(ms);return d.toLocaleDateString(LOC,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(LOC,{hour:"numeric",minute:"2-digit"})}
function isoLocal(ms){if(!ms)return "";const d=tzD(ms);return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function guessDay(id,date){
  // older entries have no day saved: pick the day whose own exercises were logged that date
  const ks=Object.keys(DAYS).filter(k=>dayHas(k,id));
  if(ks.length===1) return ks[0];
  for(const k of ks){if(daySections(k).some(s=>s.items.some(x=>ks.length&&Object.keys(DAYS).filter(q=>dayHas(q,x.id)).length===1&&entriesOf(x.id).some(e=>e.date===date&&e.done))))return k}
  return ks[0];
}

/* ----- community data ----- */
function pubPayload(){return {programs:plan.myPrograms.filter(p=>p.published).map(p=>({id:p.id,title:p.title||"Untitled program",goal:p.goal||"General fitness",level:p.level||"Beginner",desc:p.desc||"",summary:p.summary||"",who:p.who||"",targets:p.targets||[],progress:p.progress||"",equip:p.equip||"",allowCopy:!!p.allowCopy,...(p.from?{from:p.from}:{}),weeks:p.weeks,updatedAt:p.pubAt||p.updatedAt||Date.now()})),updatedAt:Date.now()}}
let pubQ=Promise.resolve();
function writePublic(){ if(state.mode!=="db"||!db||!uid) return Promise.resolve(); const payload=JSON.parse(JSON.stringify(pubPayload()));
  const run=()=>db.doc("programs/"+uid).set(payload);
  const job=pubQ.then(run,run); pubQ=job.catch(()=>{}); return job; }
function pubErrText(e){const m=String((e&&e.message)||e||"");
  let x=m.match(/LIMIT:(\d+)/); if(x) return `Your account can have ${x[1]} published program${x[1]==="1"?"":"s"}. Unpublish one first, or ask about becoming a verified trainer to publish more.`;
  if(/NEW_ACCOUNT/.test(m)) return "New accounts can publish after 3 days, or once you've logged 3 workouts. Keep training and try again soon.";
  if(/CONTENT/.test(m)) return "Add a bit more first: a write-up of a few sentences, at least 2 workout days and 6 exercises.";
  x=m.match(/SIMILAR:(.*)/); if(x) return `This is too close to "${x[1].trim()}" by another creator. Make it your own and try again.`;
  return "Couldn't update the community. Check your connection and try again.";}
function progReady(p){const w=(p.weeks[0]||{days:{}}).days;const days=Object.values(w).filter(d=>(d.items||[]).length).length;const ex=Object.values(w).reduce((a,d)=>a+(d.items||[]).length,0);
  return [{ok:(p.title||"").trim().length>=3,t:"A name"},{ok:(p.desc||"").trim().length>=40,t:"A write-up in About this program (a few sentences)"},{ok:days>=2,t:"At least 2 workout days in week 1"},{ok:ex>=6,t:"At least 6 exercises in week 1"}]}
function publishProg(p){
  const miss=progReady(p).filter(x=>!x.ok); if(miss.length){toast("Before publishing: "+miss.map(x=>x.t.toLowerCase()).join(", ")+".");return}
  const was=p.published, wasAt=p.pubAt; p.published=true;p.pubAt=Date.now();p.updatedAt=Date.now();
  const pb=$("#publish"); if(pb){pb.disabled=true;pb.textContent="Publishing…"}
  writePublic().then(()=>{savePlan();render();toast(was?"Published version updated":"Published to the community");loadCreator(true);setTimeout(checkBadges,900)})
   .catch(e=>{p.published=was;p.pubAt=wasAt;savePlan();render();showNotice("Not published",pubErrText(e))});
}
function showNotice(title,text){const sh=$("#sheet");sh.innerHTML=`<div class="grab"></div><h3 id="sheet-title">${esc(title)}</h3><p style="font-size:15px;margin:10px 0 0">${esc(text)}</p><div class="btns"><button class="btn primary" id="ntok" style="flex:1">OK</button></div>`;
  state.open="__notice";sh.hidden=false;$("#scrim").hidden=false;$("#ntok").onclick=closeSheet;$("#ntok").focus()}

let socQ=Promise.resolve();
function writeSocial(){ if(!db||!uid)return; const payload={likes:[...pg.myLikes],uses:[...pg.myUses],started:{...pg.myStarted},follows:[...(pg.myFollows||[])],...(pg.myCard?{card:pg.myCard}:{})}; pg.socialPending++;
  const run=()=>db.doc("social/"+uid).set(payload); socQ=socQ.then(run,run).catch(()=>{}).finally(()=>{pg.socialPending--}); }
function recount(){const likes={},uses={};const docs={...pg.socialDocs};if(uid)docs[uid]={likes:[...pg.myLikes],uses:[...pg.myUses]};
  Object.values(docs).forEach(v=>{(v.likes||[]).forEach(k=>likes[k]=(likes[k]||0)+1);(v.uses||[]).forEach(k=>uses[k]=(uses[k]||0)+1)});pg.social={likes,uses}}
function toggleLike(key){pg.myLikes.has(key)?pg.myLikes.delete(key):pg.myLikes.add(key);recount();writeSocial()}
function rerenderPrograms(){if(pickTab()!=="programs"||state.builder||state.stats)return;const ae=document.activeElement;if(ae&&ae.id==="pgq")return;const y=window.scrollY;render();window.scrollTo(0,y)}
function resolveNames(){if(!uCap)return;const ids=[...new Set(pg.community.map(p=>p.author).filter(Boolean))];if(!ids.length)return;
  uCap.profiles(ids).then(ps=>{let ch=false;ids.forEach(i=>{const n=(ps[i]&&ps[i].name)||"";if(pg.names[i]!==n){pg.names[i]=n;ch=true}});if(ch)rerenderPrograms()}).catch(()=>{})}
function startCommunity(){
  db.collection("programs").onSnapshot(snap=>{
    const list=[]; snap.docs.forEach(doc=>{const v=thaw(doc.data());if(!v||!Array.isArray(v.programs))return;
      v.programs.forEach(p=>{if(p&&p.id&&Array.isArray(p.weeks)&&p.weeks.length)list.push({...p,author:doc.id,key:doc.id+":"+p.id})})});
    pg.community=[...featuredPrograms(),...list]; pg.ready=true; resolveNames(); rerenderPrograms();
  },()=>{pg.ready=true;rerenderPrograms()});
  db.collection("social").onSnapshot(snap=>{
    pg.socialDocs={}; snap.docs.forEach(doc=>{const v=thaw(doc.data());if(v)pg.socialDocs[doc.id]=v});
    if(uid&&pg.socialDocs[uid]&&pg.socialPending===0){pg.myLikes=new Set(pg.socialDocs[uid].likes||[]);pg.myUses=new Set(pg.socialDocs[uid].uses||[]);pg.myStarted={...(pg.socialDocs[uid].started||{})};pg.myFollows=new Set(pg.socialDocs[uid].follows||[]);pg.myCard=pg.socialDocs[uid].card||null}
    delete pg.socialDocs[uid]; recount(); rerenderPrograms();
  },()=>{});
}

const BIG5={"barbell bench press":"bench","bench press":"bench","flat bench press":"bench","incline barbell bench press":"incline","incline bench press":"incline","military press":"military","barbell military press":"military","standing military press":"military","barbell back squat":"squat","back squat":"squat","squat":"squat","deadlift":"deadlift","barbell deadlift":"deadlift","conventional deadlift":"deadlift"};
const BIG5_LIB=[["bench","Barbell Bench Press"],["incline","Incline Barbell Bench Press"],["military","Military Press"],["squat","Barbell Back Squat"],["deadlift","Deadlift"]];
function big5(it){return BIG5[String(it&&it.name||"").trim().toLowerCase()]||null}
const NOT_COMPOUND=/dumbbell|machine|smith|close-grip|incline|decline|floor|split|goblet|sissy|sumo|hack|romanian|stiff|straight leg|pendulum|belt|calf|front|zercher|box|pause|jump|overhead|landmine|trap bar|deficit|rack pull/i;
function tracksPartner(it){if(!it||it.type==="cardio")return false;const v=plan.ptrack[it.id];if(v!=null)return !!v;return !!big5(it)}
function topW(sets){return Math.max(0,...(sets||[]).map(s=>Number(s&&s.w)||0))}
function myBest(id,before){let w=0,date=null;entriesOf(id).forEach(e=>{if(!e.done||(before&&e.date>=before))return;const t=topW(e.sets);if(t>w){w=t;date=e.date}});return {w,date}}
function pBest(pid,id,before){const p=plan.partners.find(x=>x.id===pid);let w=Number(p&&p.start&&p.start[id])||0,date=null,r=null;
  entriesOf(id).forEach(e=>{if(before&&e.date>=before)return;const x=e.partners&&e.partners[pid];if(x&&Number(x.w)>w){w=Number(x.w);date=e.date;r=x.r}});return {w,date,r}}
function cleanP(o){const out={};Object.keys(o||{}).forEach(pid=>{const x=o[pid];const w=Number(x&&x.w);if(w>0)out[pid]={w,r:x.r===""||x.r==null?null:Number(x.r)}});return out}
function trackedLifts(){return allLifts().filter(tracksPartner)}

function removePartner(pid){const p=plan.partners.find(x=>x.id===pid);if(!p)return;

  Object.keys(state.logs).forEach(id=>{let ch=false;const es=state.logs[id].entries.map(e=>{if(e.partners&&e.partners[pid]){ch=true;const q={...e.partners};delete q[pid];const n={...e};if(Object.keys(q).length)n.partners=q;else delete n.partners;return n}return e});

function allLifts(){const seen=new Set(),out=[],has=new Set();dayKeys().forEach(k=>daySections(k).forEach(s=>s.items.forEach(it=>{if(it.type!=="cardio"&&!seen.has(it.id)){seen.add(it.id);out.push(it);const b=big5(it);if(b)has.add(b)}})));

/* ---------- stats dashboards (owner + program creators). Counts only. ---------- */
function weeks8(series){
  const d=nowD(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const out=[]; for(let i=7;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-7*i);out.push({week:ymd(x),n:0})}
  (series||[]).forEach(s=>{const o=out.find(w=>w.week===s.week);if(o)o.n=Number(s.n)||0});
  return out;
}
function weekBars(series,label){
  const data=weeks8(series); const max=Math.max(1,...data.map(x=>x.n));
  const W=320,H=150,top=18,bottom=24,gap=8,bw=(W-gap*7)/8; const total=data.reduce((a,x)=>a+x.n,0);
  const bars=data.map((x,i)=>{const h=x.n?Math.max(3,(H-top-bottom)*x.n/max):0;const xx=i*(bw+gap);const y=H-bottom-h;
    const wk=new Date(x.week+"T00:00:00").toLocaleDateString(LOC,{month:"short",day:"numeric"});
    return `<g class="bar" tabindex="0" aria-label="Week of ${wk}: ${x.n} ${label}"><title>Week of ${wk}: ${x.n} ${label}</title>
      <rect x="${xx}" y="${top}" width="${bw}" height="${H-top-bottom}" fill="transparent"/>
      ${h?`<path d="M${xx} ${H-bottom}V${y+4}a4 4 0 0 1 4 -4h${bw-8}a4 4 0 0 1 4 4V${H-bottom}Z" class="bfill"/>`:""}
      ${(x.n&&(x.n===max||i===7))?`<text x="${xx+bw/2}" y="${y-5}" text-anchor="middle" class="bval">${x.n}</text>`:""}
      ${i%2===1||i===7?`<text x="${xx+bw/2}" y="${H-7}" text-anchor="middle" class="bax">${i===7?"This wk":wk}</text>`:""}</g>`}).join("");
  return `<svg class="wbars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} per week, last 8 weeks, ${total} total">
    <line x1="0" x2="${W}" y1="${H-bottom}" y2="${H-bottom}" class="bbase"/>${bars}</svg>
    <details class="stable"><summary>Show as table</summary><table><thead><tr><th>Week of</th><th>${esc(label)}</th></tr></thead><tbody>${data.map(x=>`<tr><td>${fmtDate(x.week)}</td><td>${x.n}</td></tr>`).join("")}</tbody></table></details>`;
}
function hBars(rows,unit){
  if(!rows.length) return `<p class="savenote">Nothing yet.</p>`;
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="hbars">${rows.map(r=>`<div class="hb" title="${esc(r.label)}: ${r.n} ${unit}"><span class="hbl">${esc(r.label)}</span><span class="hbt"><i style="width:${Math.max(2,r.n/max*100)}%"></i></span><b>${r.n}</b></div>`).join("")}</div>`;
}
const tile=(n,l,sub)=>`<div><b>${n}</b><small>${l}</small>${sub?`<span>${sub}</span>`:""}</div>`;
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";

/* ---------- Your Week: build a weekday by body part ---------- */
const BODY_PARTS=[["Chest",["Chest"]],["Back",["Back"]],["Shoulders",["Shoulders"]],["Arms",["Biceps","Triceps"]],["Legs",["Quads","Hamstrings","Calves"]],["Glutes",["Glutes"]],["Abs",["Abs","Obliques"]],["Cardio",["Cardio"]],["Full body",["Quads","Chest","Back","Shoulders","Hamstrings","Abs"]]];
const PICKS={Chest:["Barbell Bench Press","Incline Dumbbell Press","Cable Crossover","Chest Press Machine"],
 Back:["Lat Pulldown","Seated Cable Row","One-Arm Dumbbell Row","Pull-Ups"],
 Shoulders:["Seated Dumbbell Shoulder Press","Dumbbell Lateral Raise","Face Pulls","Military Press"],
 Biceps:["EZ-Bar Curl","Hammer Curl","Cable Curl"],Triceps:["Rope Pushdown","Overhead Cable Rope Extension","EZ-Bar Skull Crushers"],
 Quads:["Barbell Back Squat","Leg Press","Leg Extension"],Hamstrings:["Romanian Deadlift","Lying Leg Curl"],Calves:["Standing Calf Raise Machine"],
 Glutes:["Barbell Hip Thrust","Hip Abduction Machine","Cable Glute Kickback"],Abs:["Cable Crunch","Hanging Leg Raises"],Obliques:["Russian Twists"],Cardio:["Incline Treadmill Walk"]};
const WSIZE={fewer:4,normal:6,more:8};
function buildDayFrom(parts,size){
  const n=WSIZE[size]||6; const wantCardio=parts.includes("Cardio"); const lifts=parts.filter(p=>p!=="Cardio");
  const queues=lifts.map(p=>{const groups=(BODY_PARTS.find(b=>b[0]===p)||[0,[]])[1];const q=[];let i=0;
    while(q.length<12&&groups.some(g=>(PICKS[g]||[])[Math.floor(i/groups.length)])){const g=groups[i%groups.length];const name=(PICKS[g]||[])[Math.floor(i/groups.length)];if(name&&!q.includes(name))q.push(name);i++}
    return q});
  const out=[]; const cap=n-(wantCardio&&lifts.length?1:0);
  for(let r=0;out.length<cap&&queues.some(q=>q.length);r++) queues.forEach(q=>{if(out.length<cap&&q.length){const x=q.shift();if(!out.includes(x))out.push(x)}});
  const partOf=(name)=>lifts.findIndex(p=>(BODY_PARTS.find(b=>b[0]===p)||[0,[]])[1].some(g=>(PICKS[g]||[]).includes(name)));
  const sorted=out.map((n,i)=>[n,i]).sort((a,b)=>(partOf(a[0])-partOf(b[0]))||(a[1]-b[1])).map(x=>x[0]);
  if(wantCardio) sorted.push(PICKS.Cardio[0]);
  return sorted.map(name=>LIB.find(x=>x.name===name)).filter(Boolean);
}
function dayTitleFrom(parts){const p=parts.slice(); if(p.length<=1) return p[0]||"Workout"; return p.slice(0,-1).join(", ")+" & "+p[p.length-1]}

    sh.innerHTML=`<div class="grab"></div><div class="pkhead"><button class="btn small" id="wkcancel">Cancel</button><span class="eyebrow">Your week · ${WD_LONG[wd]}</span></div>
     <h3 id="sheet-title">What's on ${WD_LONG[wd]}?</h3>

     <div class="gchips" role="group" aria-label="Body parts">${BODY_PARTS.map(([p])=>`<button class="gchip ${ws.sel.includes(p)?"on":""}" data-bp="${p}" aria-pressed="${ws.sel.includes(p)}">${p}</button>`).join("")}</div>
     ${ws.sel.length?`<div class="panel wkprev"><div class="eyebrow">${WD_LONG[wd]} becomes</div><b class="wkt">${esc(title)}</b>
       <div class="wkn">${ex.length} exercises, 3×8–10 each. Swap or remove any of them after.</div>
       <div class="history">${ex.map(x=>`<div><span>${esc(x.name)}</span><span class="d">${esc(x.g)}</span></div>`).join("")}</div>
       <div class="dchips" role="group" aria-label="How many exercises">${[["fewer","Fewer"],["normal","Normal"],["more","More"]].map(([k,l])=>`<button class="dchip wide ${ws.size===k?"on":""}" data-wsz="${k}" aria-pressed="${ws.size===k}">${l}${ws.size===k?` (${ex.length})`:""}</button>`).join("")}</div></div>
       <div class="btns"><button class="btn primary" id="wkcreate" style="flex:1">Put ${esc(title)} on ${WD_LONG[wd]}</button></div>`:""}
     ${trainKeys().length?`<div class="lbl">Or use a day you already have</div><div class="dchips">${trainKeys().map(k=>`<button class="dchip wide ${cur===k?"on":""}" data-wsk="${k}">${esc(DAYS[k].label+" · "+DAYS[k].title)}</button>`).join("")}</div>`:""}
     <div class="lbl">Or</div><div class="dchips"><button class="dchip wide ${!cur?"on":""}" data-wsk="">Rest day</button></div>
     <p class="savenote">Picking body parts creates a new day you can edit like any other. Your other days aren't changed.</p>`;
    $("#wkcancel",sh).onclick=closeSheet;
    sh.querySelectorAll("[data-bp]").forEach(b=>b.onclick=()=>{const p=b.dataset.bp;ws.sel=ws.sel.includes(p)?ws.sel.filter(x=>x!==p):[...ws.sel,p];const st=sh.scrollTop;draw();sh.scrollTop=st});
    sh.querySelectorAll("[data-wsz]").forEach(b=>b.onclick=()=>{ws.size=b.dataset.wsz;const st=sh.scrollTop;draw();sh.scrollTop=st});
    sh.querySelectorAll("[data-wsk]").forEach(b=>b.onclick=()=>{const msg=assignWeekday(wd,b.dataset.wsk);closeSheet();render();toast(msg)});
    const cr=$("#wkcreate",sh); if(cr) cr.onclick=()=>{
      const used=new Set(Object.values(DAYS).map(d=>d.color)); const col=(DAY_COLORS.find(([c])=>!used.has(c))||DAY_COLORS[plan.days.length%DAY_COLORS.length])[0];
      const key="u"+Date.now().toString(36);
      plan.days.push({key,label:"Day",title,color:col});
      plan.extra[key]=ex.map((L,i)=>({sid:key+"_"+i,ex:L.id,sets:L.type==="cardio"?1:3,reps:L.type==="cardio"?[15,15]:[8,10],drop:false}));
      plan.schedule[String(wd)]=key; savePlan(); syncDays(); closeSheet();
      state.tab=key; ls.set("ll.tab",key); render(); window.scrollTo(0,0); toast(`${title} is on ${WD_LONG[wd]}`)};
  };
  state.open="__week"; sh.hidden=false; $("#scrim").hidden=false; draw(); sh.scrollTop=0;
}

const TOUR=[
 {sel:"#daypick",day:true,title:"Your workout days",text:"Today's workout opens automatically. Tap the day's name to switch days, add a day, or change which day goes on which weekday."},
 {sel:"#app [data-open]",day:true,title:"Tap a workout to log it",text:"Enter weight and reps, see what you did last time, add or remove sets, swap the exercise, or watch a form video."},
 {sel:"#app .check",day:true,title:"Mark it done",text:"Tap the box when you finish an exercise. Nothing is logged until you save the day."},
 {sel:"#saveday",day:true,scroll:true,title:"Save the day",text:"When you're done, save here. You can pick an earlier date if you're logging a past workout."},
 {sel:"#tab-programs",title:"Plans",text:"Follow a program someone shared, or build your own on a weekly calendar and share it with others."},
 {sel:"#tab-plan",title:"Your Log",text:"History, partner maxes, units (lb or kg), your week and account settings. The rest timer is right next to it."}
];
let tourI=-1;
function tourSteps(){return TOUR.filter(s=>!s.day||trainKeys().length||dayKeys().length)}
function startTour(){state.dayMenu=false;closeSheet();tourI=0;showTour()}
function endTour(){tourI=-1;const o=$("#tourov");if(o)o.remove();if(!plan.tourDone){plan.tourDone=true;savePlan()}
  if(tourList){tourList=null;gSet();setTimeout(()=>{const t=$("#tutorial");if(t)t.scrollIntoView({block:"start"})},30)}}
function showTour(){
  const steps=tourList||tourSteps(); if(tourI<0||tourI>=steps.length){endTour(true);return}
  const s=steps[tourI];
  if(s.prep){try{s.prep()}catch(e){console.warn(e)}}
  if(s.day&&!DAYS[pickTab()]){state.tab=defaultDay();render()}
  let el=document.querySelector(s.sel); if(!el||!el.getClientRects().length){tourI+=tourDir;if(tourI<0){tourI=0;tourDir=1}return showTour()}
  if(tourList){const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-110)el.scrollIntoView({block:"center"})}
  else if(s.scroll) el.scrollIntoView({block:"center"}); else if(s.day) window.scrollTo(0,0);
  requestAnimationFrame(()=>drawTour(steps,s));
}
function drawTour(steps,s){
  const el=document.querySelector(s.sel); if(!el) return;
  let ov=$("#tourov"); if(!ov){ov=document.createElement("div");ov.id="tourov";document.body.appendChild(ov)}
  const r=el.getBoundingClientRect(), pad=6, below=r.bottom+230<innerHeight, last=tourI===steps.length-1;
  ov.innerHTML=`<div class="tspot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
   <div class="tcard" role="dialog" aria-modal="true" aria-labelledby="tour-t" style="${below?`top:${Math.max(12,r.bottom+14)}px`:`bottom:${Math.max(12,innerHeight-r.top+14)}px`}">
    <button class="tx" id="tourx" aria-label="Close the guide">×</button>
    <div class="tstep">${s.ch?esc(s.ch)+" · ":""}${tourI+1} of ${steps.length}</div>
    <h4 id="tour-t">${esc(s.title)}</h4><p>${esc(s.text)}</p>
    <div class="tbtns"><button class="tskip" id="tourskip">Skip tour</button><span>${tourI?'<button id="tourback">‹ Back</button>':""}<button class="tnext" id="tournext">${last?"Done":"Next"}</button></span></div>
    <div class="tdots" aria-hidden="true" ${steps.length>10?"hidden":""}>${steps.map((_,j)=>`<i class="${j===tourI?"on":""}"></i>`).join("")}</div></div>`;
  $("#tourx").onclick=endTour; $("#tourskip").onclick=endTour;
  $("#tournext").onclick=()=>{if(last){const g=!!tourList;endTour();toast(g?"Nice. Pick another topic anytime.":"You're all set. The full tutorial is in Log → Settings.")}else{tourDir=1;tourI++;showTour()}};
  const bk=$("#tourback"); if(bk) bk.onclick=()=>{tourDir=-1;tourI--;showTour()};
  $("#tournext").focus({preventScroll:true});
}
window.addEventListener("resize",()=>{if(tourI>=0)showTour()});
document.addEventListener("keydown",e=>{if(tourI>=0&&e.key==="Escape")endTour()});

/* ---------- supersets ---------- */
function supersOf(k){return (plan.supers&&plan.supers[k])||[]}
function setSuper(k,a,b){plan.supers={...(plan.supers||{})};plan.supers[k]=supersOf(k).filter(g=>!g.includes(a)&&!g.includes(b)).concat([[a,b]]);savePlan()}
function splitSuper(k,slot){plan.supers={...(plan.supers||{})};plan.supers[k]=supersOf(k).filter(g=>!g.includes(slot));if(!plan.supers[k].length)delete plan.supers[k]}
function applySupers(k,secs){
  const sup=supersOf(k); if(!sup.length) return secs;
  const find=slot=>{for(const s of secs){const i=s.items.findIndex(x=>x.slot===slot);if(i>=0)return [s,i]}return null};
  let n=0;
  sup.forEach(([a,b])=>{const fa=find(a),fb=find(b);if(!fa||!fb||a===b)return;
    const B=fb[0].items.splice(fb[1],1)[0]; const f2=find(a); const L=String.fromCharCode(65+n++);
    f2[0].items[f2[1]]={...f2[0].items[f2[1]],ss:L+"1",ssGroup:L,ssWith:B.name};
    f2[0].items.splice(f2[1]+1,0,{...B,ss:L+"2",ssGroup:L,ssWith:f2[0].items[f2[1]].name})});
  return secs.filter(s=>s.items.length);
}
function groupCards(items){let out="",i=0;
  while(i<items.length){const it=items[i];
    if(it.ssGroup&&items[i+1]&&items[i+1].ssGroup===it.ssGroup){out+=`<div class="ssgroup"><div class="sslbl"><span>Superset · do these back to back, then rest</span><button class="linkbtn" data-split="${esc(it.slot)}" data-sday="${esc(it.dayKey)}">Split</button></div>${card(it)}${card(items[i+1])}</div>`;i+=2}
    else{out+=card(it);i++}}
  return out}
function superBox(it){

}

  const sh=$("#sheet");

function logWeighIn(lb,date){date=date||TODAY;const list=(plan.weighins||[]).filter(x=>x.d!==date);list.push({d:date,w:Math.round(lb*10)/10});list.sort((a,b)=>a.d<b.d?-1:1);

function weightChart(list){
  const data=list.slice(-26); if(data.length<2) return "";
  const vals=data.map(x=>toDisp(x.w)); let mn=Math.min(...vals),mx=Math.max(...vals); const pad=Math.max(1,(mx-mn)*.15); mn=Math.floor(mn-pad); mx=Math.ceil(mx+pad);
  const W=320,H=150,l=26,r=26,t=16,bt=24; const x=i=>l+i*(W-l-r)/(data.length-1), y=v=>t+(mx-v)/(mx-mn)*(H-t-bt);
  const ticks=[mn,Math.round((mn+mx)/2),mx];
  const grid=ticks.map(v=>`<line class="gl" x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v)+3}">${v}</text>`).join("");
  const path=vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");

  const pts=data.map((d,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(vals[i])}" r="${data.length>14?3:4}" tabindex="0"><title>${fmtDate(d.d)}: ${vals[i]} ${wU()}</title></circle>`).join("");
  return `<svg class="bwchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight, ${data.length} weigh-ins, from ${vals[0]} to ${vals[vals.length-1]} ${wU()}">${grid}<path class="ln" d="${path}"/>${pts}${labs}</svg>
   <details class="stable"><summary>Show as table</summary><table><thead><tr><th>Date</th><th>${wU()}</th></tr></thead><tbody>${data.slice().reverse().map((d,i)=>`<tr><td>${fmtDate(d.d)}</td><td>${toDisp(d.w)}</td></tr>`).join("")}</tbody></table></details>`;

/* ---------- plate calculator ---------- */
const PLATES={lb:[[45,"#1F5FC4",1],[35,"#D9A514",.9],[25,"#21875A",.8],[10,"#E8EAED",.62],[5,"#3A3F46",.5],[2.5,"#A9B0B8",.42]],
  kg:[[25,"#C92A2A",1],[20,"#1F5FC4",1],[15,"#D9A514",.9],[10,"#21875A",.8],[5,"#E8EAED",.6],[2.5,"#3A3F46",.48],[1.25,"#A9B0B8",.4]]};
const BARS={lb:[[45,"Standard bar"],[35,"Women's bar"],[15,"Technique bar"],[0,"No bar"]],kg:[[20,"Standard bar"],[15,"Women's bar"],[10,"Technique bar"],[0,"No bar"]]};
function plateBar(){const u=isKg()?"kg":"lb";const v=Number(ls.get("ll.bar."+u,null));return v!=null&&isFinite(v)&&v>=0&&v<=(u==="kg"?150:330)&&ls.get("ll.bar."+u,null)!==null?v:BARS[u][0][0]}
function platesFor(total,bar){const u=isKg()?"kg":"lb";let side=(total-bar)/2;const out=[];if(side<0)return {out,loaded:bar,short:true};
  for(const [p] of PLATES[u]){while(side>=p-1e-9){out.push(p);side-=p}}
  const loaded=bar+out.reduce((a,b)=>a+b,0)*2;return {out,loaded:Math.round(loaded*100)/100,short:false}}
function plateViz(list){const u=isKg()?"kg":"lb";const meta=Object.fromEntries(PLATES[u].map(x=>[x[0],x]));
  return `<div class="pviz" aria-hidden="true"><span class="pbar"></span><span class="pcollar"></span>${list.map(p=>{const m=meta[p];return `<span class="pl" style="--pc:${m[1]};--ph:${m[2]};--pi:${/E8EAED|A9B0B8|D9A514/.test(m[1])?"#14171B":"#fff"}"><i>${p}</i></span>`}).join("")}<span class="pend"></span></div>`}
function platePanel(){const u=isKg()?"kg":"lb";const bar=plateBar();
  return `<div class="panel" id="platep"><h2>Plate calculator</h2><p style="margin-top:0">Type the weight you want on the bar. It tells you which plates to put on <b>each side</b>.</p>
   <div class="dlabel">Bar</div><div class="drow"><div class="dchips" role="group" aria-label="Bar">${BARS[u].map(([w,l])=>`<button class="dchip ${w===bar?"on":""}" data-bar="${w}" aria-pressed="${w===bar}" title="${l}">${w?w+" "+u:"None"}</button>`).join("")}</div><label class="field dcustom"><input id="pbc" inputmode="decimal" value="${BARS[u].some(x=>x[0]===bar)?"":bar}" placeholder="Other" aria-label="Bar weight in ${u}"><span style="white-space:nowrap">${u} bar</span></label></div>
   <p class="savenote" style="margin:4px 0 0">Trap bar, safety squat bar or a heavier gym bar? Type its weight in Other.</p>
   <div class="dlabel" style="margin-top:12px">Total weight</div><div class="bwrow"><label class="field" style="max-width:170px"><input id="platew" inputmode="decimal" placeholder="${u==="kg"?"100":"225"}" aria-label="Total weight in ${u}"><span>${u}</span></label></div>
   <div id="plateout" aria-live="polite"><p class="savenote">Example: ${u==="kg"?"100 kg on a 20 kg bar = 25 + 15 each side":"225 lb on a 45 lb bar = two 45s each side"}.</p></div></div>`}
function bindPlates(){const i=$("#platew");if(!i)return;const u=isKg()?"kg":"lb";
  const draw=()=>{const w=Number((i.value||"").replace(/[^0-9.]/g,""));const bar=plateBar();const o=$("#plateout");if(!w){o.innerHTML=`<p class="savenote">Enter a weight to see the plates.</p>`;return}
    if(w<bar){o.innerHTML=`<p class="savenote">That's less than the bar (${bar} ${u}).</p>`;return}
    const r=platesFor(w,bar);const cnt={};r.out.forEach(p=>cnt[p]=(cnt[p]||0)+1);
    const txt=r.out.length?Object.entries(cnt).sort((a,b)=>b[0]-a[0]).map(([p,n])=>`<b>${n} × ${p}</b>`).join(" + "):"Just the bar";
    o.innerHTML=`${plateViz(r.out)}<p class="ptxt">Each side: ${txt}</p>${Math.abs(r.loaded-w)>0.01?`<p class="savenote">Can't make exactly ${w} ${u} with standard plates. Closest without going over: <b>${r.loaded} ${u}</b>.</p>`:`<p class="savenote">Total: ${r.loaded} ${u} = ${bar} ${u} bar + ${Math.round((r.loaded-bar)/2*100)/100} ${u} per side.</p>`}`};
  i.oninput=draw;
  const pc=$("#pbc");
  pc.oninput=()=>{const n=Number((pc.value||"").replace(/[^0-9.]/g,""));if(pc.value.trim()===""||!isFinite(n)||n>(u==="kg"?150:330))return;ls.set("ll.bar."+u,n);document.querySelectorAll("[data-bar]").forEach(x=>{const on=+x.dataset.bar===n;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});draw()};
  document.querySelectorAll("[data-bar]").forEach(b=>b.onclick=()=>{ls.set("ll.bar."+u,+b.dataset.bar);pc.value="";document.querySelectorAll("[data-bar]").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});draw()});
}

/* ---------- backup choices ("Machine taken?") ---------- */
function altKey(it){return String(it.name||"").toLowerCase()}
function defaultAlts(x){return LIB.filter(y=>y.g===x.g&&y.name!==x.name).slice(0,3).map(y=>y.name)}
function progAlts(it){if(!it.lib)return null;for(const k in plan.extra){const x=(plan.extra[k]||[]).find(y=>y.ex===it.lib&&Array.isArray(y.alts));if(x)return x.alts}return null}
function altsOf(it){const o=(plan.altsMine||{})[altKey(it)];return Array.isArray(o)?o:(progAlts(it)||it.alts||[])}
function openAltEdit(o){
  const sh=$("#sheet"); let q="";
  const res=()=>{const list=o.get();const used=new Set([o.name.toLowerCase(),...list.map(x=>x.toLowerCase())]);const ql=q.trim().toLowerCase();
    const pool=[...LIB,...plan.customs];
    const xs=ql?pool.filter(x=>x.name.toLowerCase().includes(ql)&&!used.has(x.name.toLowerCase())).slice(0,30):pool.filter(x=>x.g===o.g&&!used.has(x.name.toLowerCase())).slice(0,10);
    const nm=q.trim().replace(/\s+/g," ").slice(0,40); const exact=xs.some(x=>x.name.toLowerCase()===ql)||used.has(ql);

  const bindRes=()=>sh.querySelectorAll("[data-aadd],[data-aown]").forEach(b=>b.onclick=()=>{const l=o.get().slice();if(l.length>=8){toast("Up to 8 backup choices");return}l.push(b.dataset.aadd||b.dataset.aown);o.set(l);if(b.dataset.aown){q="";toast(`Added ${b.dataset.aown}`)}draw()});
  const draw=()=>{const list=o.get();
    sh.innerHTML=`<div class="grab"></div><div class="pkhead"><button class="btn small" id="altback">‹ Back</button><span class="eyebrow">Backup choices</span></div>
     <h3 id="sheet-title">If ${esc(o.name)} is taken…</h3><p class="savenote">${esc(o.note)}</p>
     <div class="lbl">${o.custom()?"Your choices":"Suggested choices"} <small>${list.length}</small></div>
     <div class="delist">${list.map((a,i)=>`<div class="derow"><span class="den"><b>${esc(a)}</b></span><span class="dect"><button class="iconbtn" data-aup="${i}" aria-label="Move ${esc(a)} up" ${i?"":"disabled"}>↑</button><button class="iconbtn" data-arm="${i}" aria-label="Remove ${esc(a)}">✕</button></span></div>`).join("")||`<p class="savenote">No backups. Add one below.</p>`}</div>
     ${o.custom()?`<button class="linkbtn" id="altreset" style="margin-top:8px">Go back to the suggested choices</button>`:""}
     <div class="lbl">Add a choice</div>
     <label class="field"><input id="altq" placeholder="Search, or type your own exercise" value="${esc(q)}" autocomplete="off" aria-label="Search exercises"></label>
     <div id="altres">${res()}</div>
     <div class="btns"><button class="btn primary" id="altdone" style="flex:1">Done</button></div>`;
    $("#altback",sh).onclick=o.back; $("#altdone",sh).onclick=o.back;
    sh.querySelectorAll("[data-arm]").forEach(b=>b.onclick=()=>{const l=o.get().slice();l.splice(+b.dataset.arm,1);o.set(l);draw()});
    sh.querySelectorAll("[data-aup]").forEach(b=>b.onclick=()=>{const l=o.get().slice();const i=+b.dataset.aup;[l[i-1],l[i]]=[l[i],l[i-1]];o.set(l);draw()});
    const r=$("#altreset",sh); if(r) r.onclick=()=>{o.reset();draw();toast("Back to the suggested choices")};
    $("#altq",sh).oninput=e=>{q=e.target.value;$("#altres",sh).innerHTML=res();bindRes()};
    bindRes();
  };
  state.open="__alts"; sh.hidden=false; $("#scrim").hidden=false; draw(); sh.scrollTop=0;
}
function openMyAlts(it){const k=altKey(it);plan.altsMine=plan.altsMine||{};
  openAltEdit({name:it.name,g:it.g||groupOf(it),note:`These show on ${it.name} on every day it's on. Picking one only swaps it for today. Your plan doesn't change.`,
    get:()=>altsOf(it),set:l=>{plan.altsMine[k]=l;savePlan()},custom:()=>Array.isArray(plan.altsMine[k]),reset:()=>{delete plan.altsMine[k];savePlan()},

function weekRecap(){const ws=wkStartOf(TODAY),ss=sessions().filter(s=>s.date>=ws&&s.date<=TODAY);let vol=0,prs=0;

function wrapText(g,t,x,y,max,lh,lines){const words=String(t).split(/\s+/);let line="",n=0;for(const w of words){const test=line?line+" "+w:w;if(g.measureText(test).width>max&&line){g.fillText(line,x,y+n*lh);n++;line=w;if(n>=lines-1){const rest=words.slice(words.indexOf(w)).join(" ");let r=rest;while(g.measureText(r+"…").width>max&&r.length)r=r.slice(0,-1);if(r!==rest)r+="…";g.fillText(r,x,y+n*lh);return n+1}}else line=test}if(line){g.fillText(line,x,y+n*lh);n++}return n}

function openRefInfo(){const sh=$("#sheet");
  sh.innerHTML=`<div class="grab"></div><h3 id="sheet-title">How invites work</h3>
   <ul class="lbrules"><li>Share your link. Friends who sign up with it are linked to you.</li>
    <li>A friend counts once they finish their <b>first full week</b> (3 workouts).</li>
    <li>Earn badges at 1, 3, 5, 10, 25, 50 and 100 friends. They count double toward your rank.</li>
    <li>Only new accounts can use a link, and nobody can use their own.</li></ul>
   <div class="btns"><button class="btn primary" id="refok" style="flex:1">Got it</button></div>`;
  state.open="__ref";sh.hidden=false;$("#scrim").hidden=false;sh.scrollTop=0;$("#refok",sh).onclick=closeSheet}
let celebQ=[];
function checkBadges(){try{syncCard()}catch(e){}if(window.__noCeleb||(state.mode!=="db"&&state.mode!=="local"))return;
  const {B,L}=badgeState(); const earned=B.filter(b=>b.ok).map(b=>b.id);
  if(!plan.badgeSeen){plan.badgeSeen={};earned.forEach(id=>plan.badgeSeen[id]=TODAY);plan.lvlSeen=L.lvl;savePlan();return}
  const fresh=earned.filter(id=>!plan.badgeSeen[id]);
  if(!fresh.length&&!(L.lvl>(plan.lvlSeen||1)))return;
  fresh.forEach(id=>plan.badgeSeen[id]=TODAY);
  const lvlUp=L.lvl>(plan.lvlSeen||1); plan.lvlSeen=Math.max(plan.lvlSeen||1,L.lvl); savePlan();
  if(fresh.length>3)celebQ.push({multi:fresh.map(id=>B.find(x=>x.id===id)),L});else fresh.forEach(id=>celebQ.push({b:B.find(x=>x.id===id),L}));
  if(lvlUp)celebQ.push({lvl:L});
  if(!$("#celeb"))showCeleb()}
function showCeleb(){const c=celebQ.shift();if(!c)return;const L=c.L||c.lvl;const pct=Math.round(L.into/L.need*100);
  const cols=["#C92A2A","#1F5FC4","#D9A514","#21875A","#6E44C9","#C85512"];
  const conf=Array.from({length:40},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${(Math.random()*0.6).toFixed(2)}s;--r:${Math.round(Math.random()*360)}deg"></i>`).join("");
  const el=document.createElement("div");el.id="celeb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-labelledby","celeb-t");
  el.innerHTML=`<div class="cscrim"></div><div class="conf">${conf}</div><div class="cpop">
   ${c.multi?`<div class="mstack">${c.multi.slice(0,5).map(x=>medal(x)).join("")}</div>`:c.b?medal(c.b,"big"):`<div class="lvlbig"><small>LEVEL</small><b>${L.lvl}</b></div>`}
   <div class="ey">${c.multi?"New badges":c.b?`New badge · ${({bronze:"Bronze",silver:"Silver",gold:"Gold",plat:"Platinum",diamond:"Diamond"})[c.b.tier]}`:"Level up"}</div>
   <h3 id="celeb-t">${c.multi?`${c.multi.length} badges unlocked`:c.b?esc(c.b.name):`Level ${L.lvl}!`}</h3><p>${c.multi?esc(c.multi.map(x=>x.name).join(", ")):c.b?esc(c.b.desc):`You're a ${esc(L.title)}. Keep stacking workouts.`}</p>
   ${c.multi?`<div class="xp">+${c.multi.reduce((a,x)=>a+TIERXP[x.tier],0)} XP</div>`:c.b?`<div class="xp">+${TIERXP[c.b.tier]} XP</div>`:""}
   <div class="bar"><i style="width:${pct}%"></i></div><div class="xpn">Level ${L.lvl} · ${L.into.toLocaleString(LOC)} / ${L.need.toLocaleString(LOC)} XP</div>
   <div class="btns" style="margin-top:12px"><button class="btn primary" id="cnice" style="flex:1">Nice!</button>${!c.multi?`<button class="btn" id="cshare">Share</button>`:""}</div><button class="btn" id="call" style="width:100%;margin-top:8px">See all badges</button></div>`;
  document.body.appendChild(el);
  const close=()=>{el.remove();if(celebQ.length)setTimeout(showCeleb,250)};
  $("#cnice").onclick=close; el.querySelector(".cscrim").onclick=close;const cs=$("#cshare");if(cs)cs.onclick=()=>{close();c.b?shareCard("badge",{b:c.b}):shareCard("level",{L})};
  $("#call").onclick=()=>{celebQ=[];el.remove();closeSheet();state.tab="plan";state.settings=false;state.badges={cat:"all"};render();window.scrollTo(0,0)};
  $("#cnice").focus()}

/* ---------- feedback ---------- */
const FBICON={"bug": "<path d=\"M8 9a4 4 0 0 1 8 0v5a4 4 0 0 1-8 0zM12 9v9M4 11h4M16 11h4M5 17l3-1M19 17l-3-1M9 6 7.5 4M15 6l1.5-2\"/>", "idea": "<path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/>", "confusing": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5h.01\"/>", "other": "<path d=\"M4 5h16v11H9l-5 4z\"/>"};
function openFeedback(k){const sh=$("#sheet");let kind=typeof k==="string"?k:"";
  const draw=()=>{const msg=($("#fbmsg",sh)||{}).value||"";
    sh.innerHTML=`<div class="grab"></div><div class="pkhead"><button class="btn small" id="fbcancel">Cancel</button><span class="eyebrow">Send feedback</span></div>
     <h3 id="sheet-title">What's on your mind?</h3><p class="savenote" style="margin-top:4px">Goes straight to the person who builds LiftLog. Every message gets read.</p>
     <div class="gchips" style="margin-top:10px">${[["bug","🐞 Something's broken"],["idea","💡 Idea"],["confusing","🤔 Confusing"],["other","💬 Other"]].map(([k,l])=>`<button class="gchip ${kind===k?"on":""}" data-fbk="${k}" aria-pressed="${kind===k}">${l}</button>`).join("")}</div>
     <label class="cform" style="margin-top:10px"><span class="field"><textarea id="fbmsg" rows="5" maxlength="2000" placeholder="${kind==="bug"?"What did you tap, what did you expect, and what happened?":"Tell us anything"}"></textarea></span></label>
     <p class="savenote">We include which screen you're on and your phone type, so bugs are easier to find. Never your workouts or weights.</p>
     <div class="btns"><button class="btn primary" id="fbsend" style="flex:1" ${kind?"":"disabled"}>Send</button></div>`;
    $("#fbmsg",sh).value=msg;
    $("#fbcancel",sh).onclick=closeSheet;
    sh.querySelectorAll("[data-fbk]").forEach(b=>b.onclick=()=>{kind=b.dataset.fbk;draw();$("#fbmsg",sh).focus()});
    $("#fbsend",sh).onclick=()=>{const m=$("#fbmsg",sh).value.trim();if(m.length<3){toast("Write a few words first");return}
      const meta={screen:pickTab()+(state.settings?"/settings":""),lang:(window.LIFTLOG_I18N||{}).lang||"en",ua:navigator.userAgent.slice(0,180),w:innerWidth,ver:"web"};
      const b=$("#fbsend",sh);b.disabled=true;b.textContent="Sending…";
      const mail=()=>{location.href=`mailto:zedannguyen07@gmail.com?subject=${encodeURIComponent("LiftLog feedback ("+kind+")")}&body=${encodeURIComponent(m+"\n\n"+JSON.stringify(meta))}`};
      if(!window.LIFTLOG_RPC||state.mode!=="db"){closeSheet();mail();return}
      window.LIFTLOG_RPC("send_feedback",{k:kind,m,meta}).then(()=>{closeSheet();toast("Thanks! Your feedback was sent.")})
       .catch(e=>{b.disabled=false;b.textContent="Send";if(/function|does not exist|schema cache/i.test(String(e&&e.message))){closeSheet();mail()}else toast("Couldn't send. Check your connection and try again.")})};
  };
  state.open="__fb";sh.hidden=false;$("#scrim").hidden=false;draw();sh.scrollTop=0}

/* ---------- toast ---------- */
let toastH;function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;max-width:90%;text-align:center";document.body.appendChild(t)}
 t.textContent=msg;t.hidden=false;clearTimeout(toastH);toastH=setTimeout(()=>t.hidden=true,2200)}

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;if(b.dataset.tab!=="programs")state.builder=null;state.reorder=null;state.stats=null;state.badges=null;state.dayMenu=false;state.settings=false;state.tab=b.dataset.tab==="workout"?(defaultDay()||"workout"):b.dataset.tab;ls.set("ll.tab",state.tab);closeSheet();render();window.scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});

render();

/* ---------- account storage (db) ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return bootLocal();
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return bootLocal();
    const id=await u.id(); if(!id) return bootLocal();
    db=d;uid=id;col=db.collection("data/users/"+uid); uCap=u;
    try{startCommunity()}catch(e){console.warn(e)}
    try{u.isOwner().then(v=>{pg.isOwner=!!v})}catch(e){}
    const localLogs=ls.get(LOCAL_KEY,{});
    let first=true;
    col.onSnapshot(snap=>{
      let tplDoc=null,draftsDoc=null;
      const next={};snap.docs.forEach(doc=>{const v=thaw(doc.data());
        if(doc.id==="_template"){tplDoc=v;return}
        if(doc.id==="_drafts"){draftsDoc=v;return}
        if(doc.id==="_plan"&&v){ if(planPending>0) return; if(plan.rev&&(v.rev||0)<plan.rev) return;
          plan=normPlan(v); plan.rev=v.rev||0; ls.set("ll.plan",plan); syncDays(); return}
        if(v&&Array.isArray(v.entries))next[doc.id]={entries:v.entries}});
      Object.keys(logPending).forEach(id=>{if(logPending[id]>0&&state.logs[id])next[id]=state.logs[id]});
      state.logs=next;state.mode="db";
      if(tplDoc&&tplDoc.days) ls.set("ll.tpl",tplDoc);
      try{mergeRemoteDrafts(draftsDoc)}catch(e){console.warn(e)}
      if(first){const had=draftsDoc&&draftsDoc.d===TODAY&&(draftsDoc.at||0)>=draftAt&&JSON.stringify(draftsDoc.drafts||{})===JSON.stringify(state.drafts);
        if(!had&&(Object.keys(state.drafts).length||Object.keys(ls.get("ll.left",{})).length||(draftsDoc&&draftsDoc.d!==TODAY)))setTimeout(pushDrafts,1500)}
      if(first){state.loading=false;setTimeout(checkBadges,1200);setTimeout(retryCheckin,1500);setTimeout(claimRef,1600);setTimeout(()=>{loadLibExtra();loadFriends();if(plan.customs.length)writeMyExercises()},2000);setTimeout(()=>{const l=ls.get("ll.fresh."+TODAY,[]),f=plan.fresh&&plan.fresh.d===TODAY?plan.fresh.ids||[]:[];if(l.some(x=>!f.includes(x)))setFresh(freshSet())},2200);setTimeout(()=>{if(!$("#celeb")&&!state.needsStart)checkHoliday()},2600); if(!snap.docs.some(x=>x.id==="_plan")&&!plan.template&&!HAD_LOCAL_PLAN) state.needsStart=true;}
      refreshTemplate();
      if(first){first=false;
        // move anything logged on this phone before sign-in into the account
        if(!snap.docs.some(x=>x.id==="_plan")&&(plan.template||Object.keys(plan.slots).length||plan.customs.length)) savePlan();
        Object.keys(localLogs).forEach(k=>{const have=new Set((next[k]?.entries||[]).map(e=>e.date));
          const add=(localLogs[k].entries||[]).filter(e=>!have.has(e.date));
          if(add.length){state.logs[k]={entries:[...(next[k]?.entries||[]),...add].sort((a,b)=>a.date<b.date?-1:1)};persist(k)}});
      }
      if(!state.open) render(); else {render();}
    },err=>{state.mode="local";loadLocal();bootLocal()});
  }catch(e){bootLocal()}
})();
</script>
