<style>
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:grid;place-items:start center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 32px}
#auth[hidden]{display:none}
.authcard{width:100%;max-width:420px;display:grid;gap:14px}
.authbrand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.authbrand .plate{background:var(--red)}
#auth .cform{gap:12px}
.autherr{margin:0;min-height:1.2em;font-size:13.5px;color:var(--red)}
.autherr.ok{color:var(--ok)}
#auth .linkbtn{justify-self:start;font-size:14px}
</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky day header, scrolling exercise cards, bottom tab bar; bumper-plate colors mark each day */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --fg:#14171B; --muted:#5D6570; --line:#D4D8DE;
  --map-base:#DCE0E5; --map-muscle:#C3C9D1;
  --red:#C92A2A; --blue:#1F5FC4; --yellow:#D9A514; --green:#21875A; --purple:#6E44C9; --orange:#C85512; --slate:#4A5563;
  --on-yellow:#1A1500; --ok:#21875A; --ok-soft:#DDF1E6; --warn-soft:#FFF3D6;
  --accent:var(--red); --accent-ink:#FFFFFF; --accent-soft:#F8E1E0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#191C20; --surface-2:#21252A; --fg:#ECEEF0; --muted:#99A2AD; --line:#2C3138;
  --map-base:#262B31; --map-muscle:#39404A;
  --red:#E5484D; --blue:#4C8DF0; --yellow:#F0C232; --green:#3DBA7A; --purple:#9B7BF0; --orange:#F2894A; --slate:#8A95A3;
  --ok:#3DBA7A; --ok-soft:#173326; --warn-soft:#3A3015; --accent-soft:#3A1C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#191C20; --surface-2:#21252A; --fg:#ECEEF0; --muted:#99A2AD; --line:#2C3138;
  --map-base:#262B31; --map-muscle:#39404A;
  --red:#E5484D; --blue:#4C8DF0; --yellow:#F0C232; --green:#3DBA7A; --purple:#9B7BF0; --orange:#F2894A; --slate:#8A95A3;
  --ok:#3DBA7A; --ok-soft:#173326; --warn-soft:#3A3015; --accent-soft:#3A1C1E; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body[data-day="d1"]{--accent:var(--red);--accent-ink:#fff}
body[data-day="d2"]{--accent:var(--blue);--accent-ink:#fff}
body[data-day="d3"]{--accent:var(--yellow);--accent-ink:var(--on-yellow)}
body[data-day="timer"],body[data-day="plan"],body[data-day="programs"]{--accent:var(--green);--accent-ink:#fff}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}

/* header */
.dayhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:8px}
.dayhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.plate{width:44px;height:44px;border-radius:50%;background:var(--accent);flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 5px rgba(0,0,0,.18)}
.plate span{width:12px;height:12px;border-radius:50%;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.progress-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

.banner{margin-block:6px 4px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13.5px;border:1px solid var(--line)}
.banner b{font-weight:700}
.savenote{font-size:12px;color:var(--muted);margin-block:4px 0}

/* sections & cards */
.section{margin-block:18px 0;display:grid;gap:8px}
.section h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.section h2 span{margin-right:auto}
.section h2 .rob{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:13px;font-weight:700}
.section h2 .rob.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.setctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.setctl .btn{flex:1}.setcount{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);min-width:56px;text-align:center}
.keepsets{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:8px;font-size:12.5px;color:var(--muted)}
.logdate{display:grid;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line)}
.ldrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ldpick{flex:1;min-width:150px}.ldpick input{font-family:var(--body);font-size:15px;padding:8px 0;color-scheme:inherit}
.savebar p.ldnote{font-size:12.5px;color:var(--fg);background:var(--warn-soft);border-radius:8px;padding:6px 9px}
.moveday{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.moveday span{font-family:var(--mono);font-weight:700;margin-right:auto}
.moveday .btn{padding:6px 10px;font-size:12.5px}
.pbox{border:2px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:16px}
.pbh{display:flex;justify-content:space-between;align-items:baseline}
.pbh b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.ptrow{display:grid;grid-template-columns:1fr 92px 76px;gap:8px;align-items:center}
.pnh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.prmx{font-size:12px;color:var(--red);font-weight:600}
.ptrow .pr{grid-column:1 / -1}
.pname{display:grid;gap:1px;min-width:0}.pname b{font-size:15px}.pname small{color:var(--muted);font-size:12px}
.pr{color:var(--ok);font-weight:700;font-size:12.5px}
.ptrack{font-size:13px;justify-self:start;margin-top:12px;display:block}
.pbox .ptrack{margin-top:0;color:var(--muted);font-weight:500}
.vs{font-size:13px;border-left:3px solid var(--accent);padding-left:8px;color:var(--muted)}
.vs b{color:var(--fg);font-family:var(--mono);font-size:12.5px}
.pestart{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.mx{display:grid}
.mxh,.mxr summary{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:6px;padding:8px 2px;align-items:start}
.mxh{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.mxr{border-bottom:1px dashed var(--line)}
.mxr summary{cursor:pointer;list-style:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.mxr summary::-webkit-details-marker{display:none}
.mxr summary span:first-child{font-family:var(--body);font-weight:700;font-size:14px}
.mxr .history{padding:0 2px 10px}
.up{display:block;color:var(--ok);font-size:11.5px}
.danger-zone{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.danger-zone summary{cursor:pointer;color:var(--red);font-weight:700;font-size:14px}
.danger-zone p{font-size:13.5px}
.tabs:has(nav:empty){display:none}
.panel a,.savenote a{color:var(--fg)}
.stats.s4{grid-template-columns:repeat(2,1fr)}
@media (min-width:480px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
.wbars{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.wbars .bfill{fill:var(--accent)}
.wbars .bar:hover .bfill,.wbars .bar:focus .bfill{opacity:.8}
.wbars .bar:focus{outline:none}
.wbars .bbase{stroke:var(--line);stroke-width:1}
.wbars .bval{font:700 11px var(--mono);fill:var(--fg)}
.wbars .bax{font:600 10px var(--body);fill:var(--muted)}
.stable{margin-top:6px;font-size:13px}.stable summary{cursor:pointer;color:var(--muted)}
.stable table{width:100%;border-collapse:collapse;margin-top:6px}.stable td,.stable th{text-align:left;padding:4px 2px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbt i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb b{font-family:var(--mono);font-size:13px;min-width:2ch;text-align:right}
.mxrow{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:6px;padding:8px 2px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:14px}
.mxrow span:first-child{font-family:var(--body);font-weight:700;display:grid}.mxrow small{font-weight:500;color:var(--muted);font-size:12px}
.salesp{border-style:dashed}
.dayhead .btn.small{white-space:nowrap;flex:none}
.ntab{flex:1 1 0!important;gap:3px!important;color:var(--muted)}
.ntab svg{width:24px;height:24px}
.ntab .v{font-size:11.5px!important;font-weight:600}
.ntab[aria-selected="true"]{color:var(--fg)}
.ntab[aria-selected="true"]::after{background:var(--accent)!important;left:30%!important;right:30%!important}
.tabs nav{overflow:visible!important}
.daypick{all:unset;cursor:pointer;display:grid;gap:2px;border-radius:8px}
.daypick:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.dph1{display:flex;align-items:center;gap:6px}.dph1 h1{margin:2px 0 0}.dph1 svg{flex:none;margin-top:2px}
.mscrim{position:fixed;inset:0;background:rgba(10,12,15,.35);z-index:25}
.dmenu{position:fixed;left:12px;right:12px;z-index:30;background:var(--surface);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:6px;display:grid;max-width:536px;margin:0 auto;max-height:calc(100vh - 170px);overflow-y:auto}
.dmi{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:10px}
.dmi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dmi .dot{width:12px;height:12px;border-radius:50%;background:var(--dc)}
.dmi b{font-size:16px}.dmi b.sm{font-size:14px;font-weight:600}.dmi small{display:block;color:var(--muted);font-size:12.5px}
.dmi.on{background:var(--surface-2)}
.dmi .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--red);border-radius:6px;padding:2px 7px}
.dmsep{height:1px;background:var(--line);margin:4px 8px}
.dmi.add b{color:var(--green)}.dmi.add .dot{background:none;border:2px solid var(--green);width:8px;height:8px}
.wkprev{margin-top:12px;padding:12px 14px;display:grid;gap:6px}
.wkt{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05}
.wkn{font-size:13.5px;color:var(--muted)}
.opt{font-weight:500;color:var(--muted)}
.psum{font-size:14px;color:var(--fg);line-height:1.35}
.pvsum{font-size:16px;font-weight:600;margin:6px 0 10px}
.pvtags{margin-bottom:6px}.pvtags .gchip{cursor:default}
.pvtext{margin:0;font-size:15px;white-space:pre-wrap}
.pvnote{margin:0 0 6px;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.tgtrow{margin-top:8px;align-items:center}.tgl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.gchip.small{padding:5px 10px;font-size:12.5px}
.daynote{margin-top:10px;white-space:pre-wrap}
#tourov{position:fixed;inset:0;z-index:60}
.tspot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,12,15,.62);outline:2px solid #fff;pointer-events:none;transition:all .2s}
.tcard{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:16px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tcard h4{font-family:var(--display);font-size:24px;line-height:1.05;text-transform:uppercase;margin:2px 40px 6px 0}
.tcard p{margin:0 0 12px;font-size:15px}
.tstep{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tx{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);font-size:24px;line-height:1;cursor:pointer;color:var(--fg)}
.tbtns{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbtns span{display:flex;gap:8px}
.tbtns button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--fg);cursor:pointer}
.tbtns .tnext{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tbtns .tskip{background:none;border:0;color:var(--muted);padding-left:0;font-weight:600}
.tdots{display:flex;gap:5px;justify-content:center;margin-top:10px}.tdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.tdots i.on{background:var(--accent);width:16px}
@media (prefers-reduced-motion:reduce){.tspot{transition:none}}
.ready{list-style:none;padding:0;margin:4px 0 8px;display:grid;gap:3px;font-size:13.5px;color:var(--muted)}.ready li.ok{color:var(--ok)}
.creatorbar{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}.creatorbar small{color:var(--muted);font-size:12.5px}
.reportl{font-size:13px;color:var(--muted)}
.rrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}.rrow small{display:block;color:var(--muted);font-size:12.5px}.rrow .rn{font-style:italic}.rrow .btns{margin-top:0}
.gearbtn{white-space:nowrap;flex:none}
.pnotes summary{cursor:pointer;list-style:none;display:grid;gap:2px}.pnotes summary::-webkit-details-marker{display:none}
.pnotes summary h2{margin:0}.pnotes summary span{font-size:13px;color:var(--muted)}
.pnotes summary h2::after{content:" ▾";font-size:16px;color:var(--muted)}.pnotes[open] summary h2::after{content:" ▴"}
.pnote{margin-top:12px}.pnote .pnh{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--display)}.pnote p{margin:4px 0 0}
.tick.soon{color:var(--muted);font-weight:500}
.boot{padding:40px 0;text-align:center;color:var(--muted)}
.welcome{display:grid;gap:12px;padding-bottom:24px}
.welcome h1{font-size:30px}
.wchoice{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.wchoice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wchoice:first-of-type{border:2px solid var(--accent)}
.wct{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.wcd{font-size:14px;color:var(--muted)}
.wcdays{display:grid;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.wcdays b{display:block;color:var(--fg);font-size:13px}
.unitrow{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ronote{margin:0;font-size:12.5px;color:var(--muted)}
.rolist{display:grid;gap:6px}
.rorow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 4px;box-sizing:border-box}
.rorow.ph{border:2px dashed var(--accent);background:transparent}
.rorow.dragging{box-shadow:0 10px 30px rgba(0,0,0,.25);border-color:var(--accent)}
.ronum{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--muted);width:26px;text-align:center;flex:none}
.robtn{width:46px;height:46px;font-size:20px;border-radius:10px}
.ron{flex:1;min-width:0;font-weight:700;display:grid;gap:2px}.ron small{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:12px}
.roctl{display:flex;gap:6px;flex:none}
.section h2::before{content:"";width:6px;height:18px;border-radius:2px;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;align-items:stretch;overflow:hidden}
.card.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.card .main{all:unset;cursor:pointer;padding:12px 4px 12px 14px;display:grid;gap:5px;min-width:0}
.card .main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card .name{font-weight:700;font-size:16px;line-height:1.2}
.card .swap{font-size:12.5px;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.tag.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.rx{font-family:var(--mono);font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.last{font-size:13px;border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.last b{color:var(--fg);font-family:var(--mono);font-weight:700;font-size:12.5px}
.last.today{border-color:var(--ok)}
.st{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.pend{background:var(--warn-soft);color:var(--fg)}
.savebar{margin-block:22px 0;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;display:grid;gap:8px}
.savehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.savehead b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- program data (from "3 Day Training Split") ---------- */
const DAYS={}; let TPL=null; let BUILTIN=[];


/* ---------- body map ---------- */
function bodyMap(primary,secondary,showLabels=true){
  const P=new Set(primary),S=new Set(secondary);
  const c=(g)=>"m"+(P.has(g)?" p":S.has(g)?" s":"");
  const base=(x)=>`<circle class="base" cx="${x}" cy="16" r="10"/><rect class="base" x="${x-4}" y="25" width="8" height="6"/>
   <path class="base" d="M${x-22} 34 Q${x} 28 ${x+22} 34 L${x+19} 86 Q${x} 92 ${x-19} 86Z"/>
   <path class="base" d="M${x-23} 34 L${x-33} 88 L${x-25} 90 L${x-17} 44Z"/><path class="base" d="M${x+23} 34 L${x+33} 88 L${x+25} 90 L${x+17} 44Z"/>
   <path class="base" d="M${x-18} 86 L${x-14} 160 L${x-4} 160 L${x-1} 92Z"/><path class="base" d="M${x+18} 86 L${x+14} 160 L${x+4} 160 L${x+1} 92Z"/>`;
  const F=50,B=150;
  return `<svg class="map" viewBox="0 0 200 178" role="img" aria-label="Muscles worked">
  ${base(F)}${base(B)}

  if(["Quads","Hamstrings","Glutes","Calves"].includes(g)) return "Legs";
  if(g==="Forearms"&&secs.includes("Biceps")&&!secs.includes("Forearms")) return "Biceps";
  return g;
}
function effItem(dayKey,orig,sec){
  const slot=dayKey+":"+orig.id; const o=plan.slots[slot]; const L=o&&libById(o.ex);
  if(!L) return {...orig,sec,slot,dayKey,g:groupOf({...orig,sec})};
  const type=L.type||"lift";
  return {id:(L.custom?"c_":"x_")+L.id,name:L.name,sets:o.sets,reps:o.reps,drop:!!o.drop,type,target:L.g,g:L.g,
    p:L.p||G2M[L.g]||[],s:L.s||[],each:false,
    note:L.custom?`Your own exercise (${L.g}).`:"",
    alts:LIB.filter(x=>x.g===L.g&&x.id!==L.id).slice(0,3).map(x=>x.name),
    sec:sectionFor(L.g,dayKey),slot,dayKey,replaced:orig.name,lib:L.id,custom:!!L.custom};
}
function extraItem(dayKey,x){const L=libById(x.ex);if(!L)return null;const type=L.type||"lift";
  return {id:(L.custom?"c_":"x_")+L.id,name:L.name,sets:x.sets,reps:x.reps,drop:!!x.drop,type,target:L.g,g:L.g,p:L.p||G2M[L.g]||[],s:L.s||[],each:false,
    note:L.custom?`Your own exercise (${L.g}).`:"",alts:LIB.filter(y=>y.g===L.g&&y.id!==L.id).slice(0,3).map(y=>y.name),
    sec:sectionFor(L.g,dayKey),slot:dayKey+":+"+x.sid,dayKey,extra:x.sid,lib:L.id,custom:!!L.custom}}
function applyPick(it,exId,sets,reps,drop){
  if(it.progMode){const L=libById(exId);if(L)it.onPick({name:L.name,g:L.g,type:L.type||"lift",sets,reps,drop:!!drop,p:L.p||G2M[L.g]||[],s:L.s||[],eq:L.eq||"Custom"});savePlan();return}
  if(it.addMode){(plan.extra[it.dayKey]=plan.extra[it.dayKey]||[]).push({sid:Date.now().toString(36),ex:exId,sets,reps,drop})}
  else if(it.extra){const x=(plan.extra[it.dayKey]||[]).find(y=>y.sid===it.extra);if(x)Object.assign(x,{ex:exId,sets,reps,drop})}
  else plan.slots[it.slot]={ex:exId,sets,reps,drop};
  if(!it.addMode&&it.slot) delete plan.sets[it.slot];
  savePlan();
}
function daySections(dayKey){
  const d=DAYS[dayKey]; const order=d.sections.map(x=>x.sec); const map={};
  d.sections.forEach(sc=>sc.items.forEach(orig=>{if(plan.hidden[dayKey+":"+orig.id])return;const e=effItem(dayKey,orig,sc.sec);(map[e.sec]=map[e.sec]||[]).push(e)}));
  (plan.extra[dayKey]||[]).forEach(x=>{const e=extraItem(dayKey,x);if(e)(map[e.sec]=map[e.sec]||[]).push(e)});
  Object.keys(map).forEach(k=>{if(!order.includes(k)){const i=order.indexOf("Abs");order.splice(i<0?order.length:i,0,k)}});
  if(d.custom){const CAN=["Chest","Back","Shoulders","Traps","Biceps","Triceps","Forearms","Legs","Abs","Obliques","Cardio"];order.sort((x,y)=>(CAN.indexOf(x)+1||50)-(CAN.indexOf(y)+1||50))}
  Object.keys(map).forEach(k=>{map[k]=map[k].map(x=>{const n=plan.sets[x.slot];return n&&n!==x.sets&&x.type!=="cardio"?{...x,sets:n}:x})});
  const ord=(plan.order&&plan.order[dayKey])||{};
  Object.keys(map).forEach(k=>{const o=ord[k];if(!o||!o.length)return;const pos=x=>{const i=o.indexOf(x.slot);return i<0?1e6:i};
    map[k]=map[k].map((x,i)=>[x,i]).sort((a,b)=>(pos(a[0])-pos(b[0]))||(a[1]-b[1])).map(a=>a[0])});
  return order.filter(k=>map[k]&&map[k].length).map(k=>({sec:k,items:map[k]}));
}

const logPending={};
function persist(id){
  const doc=state.logs[id];
  if(state.mode!=="db"){ls.set(LOCAL_KEY,state.logs);return Promise.resolve()}
  const payload={entries:JSON.parse(JSON.stringify(doc.entries.slice(-1000)))};
  logPending[id]=(logPending[id]||0)+1;
  const run=()=>col.doc(id).set(payload).catch(e=>{
    if(e&&e.code==="unavailable") return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(()=>col.doc(id).set(payload));
    console.warn(e); toast("Couldn't save to your log. It's kept on this phone for now.");
    ls.set(LOCAL_KEY,state.logs);
  });
  queues[id]=(queues[id]||Promise.resolve()).then(run,run).finally(()=>{logPending[id]--});
  return queues[id];
}
function entriesOf(id){return (state.logs[id]&&state.logs[id].entries)||[]}
function todayEntry(id){return entriesOf(id).find(e=>e.date===TODAY)}
function lastEntry(id){const es=entriesOf(id).filter(e=>e.date<TODAY&&e.done);return es[es.length-1]}

function draftFor(it){
  if(!state.drafts[it.id]){
    const t=todayEntry(it.id);
    state.drafts[it.id]=t?{sets:JSON.parse(JSON.stringify(t.sets)).map(x=>({w:x.w??"",r:x.r??""})),alt:t.alt||null,marked:true,partners:JSON.parse(JSON.stringify(t.partners||{}))}:{sets:Array.from({length:it.sets},()=>({w:"",r:""})),alt:null,marked:false};
  }
  const d=state.drafts[it.id];
  if(d.n==null&&d.sets.length>it.sets) d.n=d.sets.length;
  const n=nSets(it,d);
  while(d.sets.length<n) d.sets.push({w:"",r:""});
  return d;
}
function planSets(it,n){const o=ORIG[String(it.slot).split(":")[1]];
  if(it.extra){const x=(plan.extra[it.dayKey]||[]).find(y=>y.sid===it.extra);if(x)x.sets=n;delete plan.sets[it.slot]}
  else if(plan.slots[it.slot]){plan.slots[it.slot].sets=n;delete plan.sets[it.slot]}
  else if(o&&o.sets===n) delete plan.sets[it.slot]; else plan.sets[it.slot]=n;
  savePlan();rebuildAll()}
function nSets(it,d){return it.type==="cardio"?1:(d&&d.n!=null?d.n:it.sets)}
function dSets(it,d){return d.sets.slice(0,nSets(it,d))}
function saveDrafts(){ls.set("ll.drafts."+TODAY,state.drafts)}

function cleanSets(sets){return sets.map(s=>({w:s.w===""?null:Number(s.w),r:s.r===""?null:Number(s.r)})).filter(s=>s.w!==null||s.r!==null)}
function isMarked(id){const d=state.drafts[id];return d?!!d.marked:!!todayEntry(id)}
function isPending(id){
  const d=state.drafts[id]; if(!d) return false; const t=todayEntry(id);
  if(!d.marked) return !!t;
  if(!t) return true;
  const it0=ALL[id]||{sets:d.sets.length};return JSON.stringify(cleanSets(dSets(it0,d)))!==JSON.stringify(t.sets||[])||(d.alt||null)!==(t.alt||null)||JSON.stringify(cleanP(d.partners))!==JSON.stringify(t.partners||{});
}
function toggleMark(it,on){
  const d=draftFor(it); d.marked=on===undefined?!d.marked:on; saveDrafts();
  render(); if(state.open===it.id) openSheet(it.id,true);

function dayHas(k,id){return daySections(k).some(s=>s.items.some(x=>x.id===id))}
function dayOf(it){const cur=pickTab();if(DAYS[cur]&&dayHas(cur,it.id))return cur;return Object.keys(DAYS).find(k=>dayHas(k,it.id))}
function logDate(){const v=state.logDate;return v&&v<TODAY?v:TODAY}
function saveDay(dayKey){
  const DATE=logDate(), past=DATE!==TODAY;
  const all=daySections(dayKey).flatMap(s=>s.items);
  const items=past?all.filter(it=>isMarked(it.id)&&state.drafts[it.id]):all.filter(it=>isPending(it.id));
  if(!items.length) return;
  items.forEach(it=>{
    const d=draftFor(it);
    if(!state.logs[it.id]) state.logs[it.id]={entries:[]};
    const prev=state.logs[it.id].entries.find(e=>e.date===DATE);
    const es=state.logs[it.id].entries.filter(e=>e.date!==DATE);
    const now=Date.now();
    const kc=exKcal(it,cleanSets(dSets(it,d)));
    if(d.marked) es.push({date:DATE,day:dayKey,dl:DAYS[dayKey].label,dt:DAYS[dayKey].title,name:it.name,sec:it.sec,type:it.type,done:true,alt:d.alt||null,sets:cleanSets(dSets(it,d)),...(Object.keys(cleanP(d.partners)).length?{partners:cleanP(d.partners)}:{}),kcal:kc==null?null:Math.round(kc),loggedAt:(prev&&(prev.loggedAt||prev.ts))||now,ts:now});

    render(); toast(`${DAYS[dayKey].label} saved for ${fmtDate(DATE)}: ${items.length} workout${items.length===1?"":"s"} logged`); return}
  const n=all.filter(it=>todayEntry(it.id)).length;
  ls.set("ll.savedAt."+dayKey+"."+TODAY,Date.now());
  render(); toast(`${DAYS[dayKey].label} saved: ${n} workout${n===1?"":"s"} logged`);
}

/* ---------- calorie estimate ---------- */
const KCAL={base:2.5,eff:0.2,rom:0.5,cardioMet:5.0,secPerRep:3};
function exKcal(it,sets){
  const bw=Number(plan.bw); if(!bw) return null; const kg=bw*0.4536;
  if(it.type==="cardio"){const min=(sets[0]&&Number(sets[0].w))||it.reps[0]||10;return KCAL.cardioMet*kg*min/60}
  const p=dropPct/100, multi=it.drop&&!dropAuto, dm=multi?3:1, lf=multi?(3-3*p):1, rest=timer.preset||90;
  const list=sets&&sets.length?sets:Array.from({length:it.sets},()=>({w:null,r:null}));
  let k=0;
  list.forEach(st=>{
    const r=(Number(st.r)||Math.round((it.reps[0]+it.reps[1])/2))*(it.each?2:1);
    const ext=st.w?Number(st.w)*0.4536:0;
    const load=it.type==="bw"?0.5*kg+ext:ext;
    const workJ=load*r*KCAL.rom*9.81*lf;
    k+=workJ/KCAL.eff/4184 + KCAL.base*kg*(r*KCAL.secPerRep*dm+rest)/3600;
  });
  return k;
}
function curSets(it){const dr=state.drafts[it.id];const t=todayEntry(it.id);return dr?cleanSets(dSets(it,dr)):(t?t.sets:[])}

function hintFor(it){
  const last=lastEntry(it.id); if(!last||it.type==="cardio") return "";
  const s=(last.sets||[])[0]; if(!s||!s.r) return "";
  if(s.r>=it.reps[1]){
    const small=/curl|raise|fly|flies|sway|extension|pushdown|pull downs|skull/i.test(it.name);const step=isKg()?(small?2.5:5):(small?5:10);
    return s.w?`Hit ${s.r} reps at ${toDisp(s.w)} ${wU()} last time. Try ${Math.round((toDisp(s.w)+step)*10)/10} ${wU()}.`:`Hit ${s.r} reps last time. Add weight or reps.`;
  }
  return "";
}

/* ---------- drop sets ---------- */
let dropPct=ls.get("ll.dropPct",20);
const DROP_CHOICES=[10,15,20,25,30];
function dropW(w,n){return rPlate(w*(1-dropPct/100*n))}
function dropsTxt(w){return w?`drops: ${toDisp(w)} → ${toDisp(dropW(w,1))} → ${toDisp(dropW(w,2))} ${wU()} (${dropPct}% each)`:""}
let dropAuto=ls.get("ll.dropAuto",true);
function autoW(w,n){if(n<=2)return Math.max(minPlate(),dropW(w,n));return Math.max(minPlate(),rPlate(autoW(w,n-1)*(1-dropPct/100)))}
function refillDrops(it,d){
  if(!it.drop||!dropAuto) return;
  d.autoIdx=d.autoIdx||[];
  const w=Number(d.sets[0]&&d.sets[0].w);
  for(let j=1;j<nSets(it,d)&&j<d.sets.length;j++){
    const isAuto=d.autoIdx.includes(j);
    if(!w){if(isAuto){d.sets[j].w="";d.autoIdx=d.autoIdx.filter(x=>x!==j)}continue}
    if(d.sets[j].w===""||isAuto){const prev=Number(d.sets[j-1].w)||autoW(w,j-1);d.sets[j].w=String(j<=2?autoW(w,j):Math.max(minPlate(),rPlate(prev*(1-dropPct/100))));if(!isAuto)d.autoIdx.push(j)}
  }
}
function setDropPct(v){v=Math.round(Number(v));if(!(v>=5&&v<=45))return false;dropPct=v;ls.set("ll.dropPct",v);return true}
function dropChips(prefix){return `<div class="dchips" role="group" aria-label="Drop size">${DROP_CHOICES.map(v=>`<button class="dchip ${v===dropPct?"on":""}" data-${prefix}="${v}" aria-pressed="${v===dropPct}">${v}%</button>`).join("")}</div>`}

const timer={preset:ls.get("ll.preset",90),endAt:null,remain:null,running:false,over:false};

const NOTIFY_DEF={sound:true,vibrate:true,awake:true,banner:true};
function nPref(k){const n=(plan&&plan.notify)||{};return n[k]==null?NOTIFY_DEF[k]:!!n[k]}
function beep(){
  if(nPref("sound")) try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach((t,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=i===2?1320:880;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,audioCtx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.28);
      o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.3)})}catch(e){}
  if(nPref("vibrate")) try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}
  if(nPref("banner")&&pickTab()!=="timer") toast("⏱ Rest's over. Next set!");
}
function startTimer(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
  timer.endAt=Date.now()+timer.preset*1000;timer.running=true;timer.over=false;
  if(nPref("awake")) try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
  tick();
}
function stopTimer(){timer.running=false;timer.endAt=null;timer.over=false;try{wake&&wake.release()}catch(e){};wake=null;clearTimeout(tickH);updateTimer()}
function tick(){
  clearTimeout(tickH);
  if(timer.running){
    const left=(timer.endAt-Date.now())/1000;
    if(left<=0&&!timer.over){timer.over=true;beep();document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash")}
    if(left<=-60){stopTimer();return}
    tickH=setTimeout(tick,200);
  }
  updateTimer();
}
function updateTimer(){
  const pill=$("#pill");
  const left=timer.running?(timer.endAt-Date.now())/1000:timer.preset;
  const onTimerTab=pickTab()==="timer";
  pill.hidden=!timer.running||onTimerTab;
  if(timer.running){pill.textContent=timer.over?"Rest over · GO":"Rest "+fmtT(left);pill.classList.toggle("over",timer.over)}
  const t=$("#tread"); if(!t) return;
  t.textContent=timer.over?"GO":fmtT(left);
  $("#tstate").textContent=timer.over?"Rest's over. Next set!":timer.running?"Resting…":"Ready";
  const frac=timer.running?Math.max(0,left)/timer.preset:1;
  $("#tbar").style.strokeDashoffset=String(565.5*(1-frac));
  $("#tgo").textContent=timer.running?(timer.over?"Done":"Stop"):"Start rest";
  $(".timer").classList.toggle("over",timer.over);
  document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("on",+b.dataset.s===timer.preset));
  $("#tval").textContent=fmtT(timer.preset);
}

function guessDay(id,date){
  // older entries have no day saved: pick the day whose own exercises were logged that date
  const ks=Object.keys(DAYS).filter(k=>dayHas(k,id));
  if(ks.length===1) return ks[0];
  for(const k of ks){if(daySections(k).some(s=>s.items.some(x=>ks.length&&Object.keys(DAYS).filter(q=>dayHas(q,x.id)).length===1&&entriesOf(x.id).some(e=>e.date===date&&e.done))))return k}
  return ks[0];
}
function sessions(){
  const map={};
  Object.keys(state.logs).forEach(id=>{
    entriesOf(id).forEach(e=>{if(!e.done)return;const it=itemForLog(id,e);const day=e.day||guessDay(id,e.date);const k=e.date+"|"+day;
      const s=map[k]||(map[k]={date:e.date,day,items:[],loggedAt:Infinity,updatedAt:0});
      const itm=(DAYS[day]&&daySections(day).flatMap(x=>x.items).find(x=>x.id===id))||it;
      s.items.push({it:itm,e});s.kcal=(s.kcal||0)+(e.kcal||0);s.loggedAt=Math.min(s.loggedAt,e.loggedAt||e.ts||0);s.updatedAt=Math.max(s.updatedAt,e.ts||0)})});
  const order=(day,id)=>{const list=DAYS[day]?daySections(day).flatMap(x=>x.items).map(x=>x.id):[];const i=list.indexOf(id);return i<0?99:i};
  return Object.values(map).map(s=>{s.items.sort((a,b)=>order(s.day,a.it.id)-order(s.day,b.it.id));if(s.loggedAt===Infinity)s.loggedAt=0;return s})

function weekFromPlan(){const w=emptyWeek();[0,1,2,3,4,5,6].forEach(i=>{const k=schedOf(i);if(!k)return;

/* ----- community data ----- */
function pubPayload(){return {programs:plan.myPrograms.filter(p=>p.published).map(p=>({id:p.id,title:p.title||"Untitled program",goal:p.goal||"General fitness",level:p.level||"Beginner",desc:p.desc||"",summary:p.summary||"",who:p.who||"",targets:p.targets||[],progress:p.progress||"",equip:p.equip||"",allowCopy:!!p.allowCopy,...(p.from?{from:p.from}:{}),weeks:p.weeks,updatedAt:p.pubAt||p.updatedAt||Date.now()})),updatedAt:Date.now()}}
let pubQ=Promise.resolve();
function writePublic(){ if(state.mode!=="db"||!db||!uid) return Promise.resolve(); const payload=JSON.parse(JSON.stringify(pubPayload()));
  const run=()=>db.doc("programs/"+uid).set(payload);
  const job=pubQ.then(run,run); pubQ=job.catch(()=>{}); return job; }
function pubErrText(e){const m=String((e&&e.message)||e||"");
  let x=m.match(/LIMIT:(\d+)/); if(x) return `Your account can have ${x[1]} published program${x[1]==="1"?"":"s"}. Unpublish one first, or ask about becoming a verified trainer to publish more.`;
  if(/NEW_ACCOUNT/.test(m)) return "New accounts can publish after 3 days, or once you've logged 3 workouts. Keep training and try again soon.";
  if(/CONTENT/.test(m)) return "Add a bit more first: a write-up of a few sentences, at least 2 workout days and 6 exercises.";
  x=m.match(/SIMILAR:(.*)/); if(x) return `This is too close to "${x[1].trim()}" by another creator. Make it your own and try again.`;
  return "Couldn't update the community. Check your connection and try again.";}
function progReady(p){const w=(p.weeks[0]||{days:{}}).days;const days=Object.values(w).filter(d=>(d.items||[]).length).length;const ex=Object.values(w).reduce((a,d)=>a+(d.items||[]).length,0);
  return [{ok:(p.title||"").trim().length>=3,t:"A name"},{ok:(p.desc||"").trim().length>=40,t:"A write-up in About this program (a few sentences)"},{ok:days>=2,t:"At least 2 workout days in week 1"},{ok:ex>=6,t:"At least 6 exercises in week 1"}]}
function publishProg(p){
  const miss=progReady(p).filter(x=>!x.ok); if(miss.length){toast("Before publishing: "+miss.map(x=>x.t.toLowerCase()).join(", ")+".");return}
  const was=p.published, wasAt=p.pubAt; p.published=true;p.pubAt=Date.now();p.updatedAt=Date.now();
  const pb=$("#publish"); if(pb){pb.disabled=true;pb.textContent="Publishing…"}
  writePublic().then(()=>{savePlan();render();toast(was?"Published version updated":"Published to the community");loadCreator(true)})
   .catch(e=>{p.published=was;p.pubAt=wasAt;savePlan();render();showNotice("Not published",pubErrText(e))});
}
function showNotice(title,text){const sh=$("#sheet");sh.innerHTML=`<div class="grab"></div><h3 id="sheet-title">${esc(title)}</h3><p style="font-size:15px;margin:10px 0 0">${esc(text)}</p><div class="btns"><button class="btn primary" id="ntok" style="flex:1">OK</button></div>`;
  state.open="__notice";sh.hidden=false;$("#scrim").hidden=false;$("#ntok").onclick=closeSheet;$("#ntok").focus()}

let socQ=Promise.resolve();
function writeSocial(){ if(!db||!uid)return; const payload={likes:[...pg.myLikes],uses:[...pg.myUses],started:{...pg.myStarted}}; pg.socialPending++;
  const run=()=>db.doc("social/"+uid).set(payload); socQ=socQ.then(run,run).catch(()=>{}).finally(()=>{pg.socialPending--}); }
function recount(){const likes={},uses={};const docs={...pg.socialDocs};if(uid)docs[uid]={likes:[...pg.myLikes],uses:[...pg.myUses]};
  Object.values(docs).forEach(v=>{(v.likes||[]).forEach(k=>likes[k]=(likes[k]||0)+1);(v.uses||[]).forEach(k=>uses[k]=(uses[k]||0)+1)});pg.social={likes,uses}}
function toggleLike(key){pg.myLikes.has(key)?pg.myLikes.delete(key):pg.myLikes.add(key);recount();writeSocial()}

function resolveNames(){if(!uCap)return;const ids=[...new Set(pg.community.map(p=>p.author).filter(Boolean))];if(!ids.length)return;

function startCommunity(){
  db.collection("programs").onSnapshot(snap=>{
    const list=[]; snap.docs.forEach(doc=>{const v=thaw(doc.data());if(!v||!Array.isArray(v.programs))return;
      v.programs.forEach(p=>{if(p&&p.id&&Array.isArray(p.weeks)&&p.weeks.length)list.push({...p,author:doc.id,key:doc.id+":"+p.id})})});
    pg.community=list; pg.ready=true; resolveNames(); rerenderPrograms();
  },()=>{pg.ready=true;rerenderPrograms()});
  db.collection("social").onSnapshot(snap=>{
    pg.socialDocs={}; snap.docs.forEach(doc=>{const v=thaw(doc.data());if(v)pg.socialDocs[doc.id]=v});

function clearProgramDays(){
  const keys=plan.days.filter(d=>d.prog).map(d=>d.key);
  plan.days=plan.days.filter(d=>!d.prog);
  keys.forEach(k=>{delete plan.extra[k];
    Object.keys(plan.slots).forEach(x=>{if(x.startsWith(k+":"))delete plan.slots[x]});
    Object.keys(plan.hidden).forEach(x=>{if(x.startsWith(k+":"))delete plan.hidden[x]});
    Object.keys(plan.schedule).forEach(w=>{if(plan.schedule[w]===k)delete plan.schedule[w]})});
}
function exToLibId(x){
  const L=LIB.find(l=>l.name.toLowerCase()===String(x.name).toLowerCase()); if(L) return L.id;
  let c=plan.customs.find(c=>c.name.toLowerCase()===String(x.name).toLowerCase()&&c.g===x.g);
  if(!c){c={id:slug(x.name)+"-"+newId(),name:x.name,g:GROUPS.includes(x.g)?x.g:"Chest",type:x.type||"lift",custom:true,p:x.p&&x.p.length?x.p:G2M[x.g]||[],s:x.s||[]};plan.customs.push(c)}
  return c.id;
}
function applyProgram(p,wi){
  clearProgramDays(); plan.schedule={};
  const w=p.weeks[wi]; const colors=["--green","--purple","--orange","--slate","--blue","--red","--yellow"]; let ci=0;
  WEEK_ORDER.forEach(i=>{const d=w.days[String(i)];if(!d)return;const key="pw"+i;
    plan.days.push({key,label:WD_SHORT[i],title:d.title||"Workout",color:colors[ci++%colors.length],prog:true,note:(d.note||"").trim()||undefined});
    plan.extra[key]=d.items.map(x=>({sid:newId(),ex:exToLibId(x),sets:x.sets||3,reps:x.reps||[8,12],drop:!!x.drop}));
    plan.schedule[String(i)]=key});
  plan.activeProgram={key:p.key,title:p.title,week:wi,weeks:p.weeks.length,author:p.author||null,snapshot:JSON.parse(JSON.stringify(p.weeks))};
  savePlan(); syncDays();
}
function stopProgram(){
  const k=plan.activeProgram&&plan.activeProgram.key;
  clearProgramDays(); plan.schedule={...((TPL&&TPL.schedule)||{})}; plan.activeProgram=null; savePlan(); syncDays();
  if(k&&pg.myUses.has(k)){pg.myUses.delete(k);recount();writeSocial()}
  render(); toast("Stopped. Your week is back to Days 1–3.");
}

/* ---------- gym partners (their top set on the big lifts) ---------- */
const COMPOUND=/bench press|military press|overhead press|shoulder press|squat|deadlift/i;
const NOT_COMPOUND=/dumbbell|machine|smith|close-grip|split|goblet|sissy|sumo|hack|romanian|stiff|straight leg|pendulum|belt|calf/i;
function tracksPartner(it){if(!it||it.type==="cardio")return false;const v=plan.ptrack[it.id];if(v!=null)return !!v;return COMPOUND.test(it.name)&&!NOT_COMPOUND.test(it.name)}
function topW(sets){return Math.max(0,...(sets||[]).map(s=>Number(s&&s.w)||0))}
function myBest(id,before){let w=0,date=null;entriesOf(id).forEach(e=>{if(!e.done||(before&&e.date>=before))return;const t=topW(e.sets);if(t>w){w=t;date=e.date}});return {w,date}}
function pBest(pid,id,before){const p=plan.partners.find(x=>x.id===pid);let w=Number(p&&p.start&&p.start[id])||0,date=null,r=null;
  entriesOf(id).forEach(e=>{if(before&&e.date>=before)return;const x=e.partners&&e.partners[pid];if(x&&Number(x.w)>w){w=Number(x.w);date=e.date;r=x.r}});return {w,date,r}}
function cleanP(o){const out={};Object.keys(o||{}).forEach(pid=>{const x=o[pid];const w=Number(x&&x.w);if(w>0)out[pid]={w,r:x.r===""||x.r==null?null:Number(x.r)}});return out}
function trackedLifts(){const seen=new Set(),out=[];trainKeys().forEach(k=>daySections(k).forEach(s=>s.items.forEach(it=>{if(tracksPartner(it)&&!seen.has(it.id)){seen.add(it.id);out.push(it)}})));return out}
function vsLine(it){if(!plan.partners.length||!tracksPartner(it))return "";const me=myBest(it.id).w;
  return `<span class="vs">Best · You <b>${me?toDisp(me):"—"}</b>${plan.partners.map(p=>{const w=pBest(p.id,it.id).w;return ` · ${esc(p.name)} <b>${w?toDisp(w):"—"}</b>`}).join("")}</span>`}
function partnerBox(it,d){
  if(it.type==="cardio") return "";
  if(!tracksPartner(it)) return `<button class="linkbtn ptrack" id="ptrackon">+ Track a partner's max on this lift</button>`;
  d.partners=d.partners||{};
  const rows=plan.partners.map(p=>{const b=pBest(p.id,it.id);const x=d.partners[p.id]||{w:"",r:""};const nw=Number(x.w)||0;
    return `<div class="ptrow"><span class="pname"><span class="pnh"><b>${esc(p.name)}</b><button class="linkbtn prmx" data-prmx="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></span><small>${b.w?`Best ${toDisp(b.w)}${b.r?` × ${b.r}`:""}${b.date?` · ${fmtDate(b.date)}`:" · starting max"}`:"No max yet"}</small></span>
      <label class="field"><input inputmode="decimal" data-pw="${p.id}" value="${esc(toDisp(x.w))}" placeholder="${b.w?toDisp(b.w):wU()}" aria-label="${esc(p.name)} top weight today"><span>${wU()}</span></label>
      <label class="field"><input inputmode="numeric" data-pr="${p.id}" value="${esc(x.r)}" placeholder="—" aria-label="${esc(p.name)} reps"><span>reps</span></label>
      ${nw>b.w&&b.w?`<span class="pr">▲ New best for ${esc(p.name)}: ${toDisp(nw)} ${wU()} (+${toDisp(nw-b.w)})</span>`:nw&&!b.w?`<span class="pr">First max logged for ${esc(p.name)}</span>`:""}</div>`}).join("");
  return `<div class="pbox"><div class="pbh"><b>Partner</b><button class="linkbtn" id="paddp">+ Add partner</button></div>
   ${plan.partners.length?rows:`<p class="savenote" style="margin:0">Add your gym partner to log just their top set here.</p>`}

function weeks8(series){
  const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const out=[]; for(let i=7;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-7*i);out.push({week:ymd(x),n:0})}
  (series||[]).forEach(s=>{const o=out.find(w=>w.week===s.week);if(o)o.n=Number(s.n)||0});
  return out;
}
function weekBars(series,label){
  const data=weeks8(series); const max=Math.max(1,...data.map(x=>x.n));
  const W=320,H=150,top=18,bottom=24,gap=8,bw=(W-gap*7)/8; const total=data.reduce((a,x)=>a+x.n,0);
  const bars=data.map((x,i)=>{const h=x.n?Math.max(3,(H-top-bottom)*x.n/max):0;const xx=i*(bw+gap);const y=H-bottom-h;
    const wk=new Date(x.week+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
    return `<g class="bar" tabindex="0" aria-label="Week of ${wk}: ${x.n} ${label}"><title>Week of ${wk}: ${x.n} ${label}</title>
      <rect x="${xx}" y="${top}" width="${bw}" height="${H-top-bottom}" fill="transparent"/>
      ${h?`<path d="M${xx} ${H-bottom}V${y+4}a4 4 0 0 1 4 -4h${bw-8}a4 4 0 0 1 4 4V${H-bottom}Z" class="bfill"/>`:""}
      ${(x.n&&(x.n===max||i===7))?`<text x="${xx+bw/2}" y="${y-5}" text-anchor="middle" class="bval">${x.n}</text>`:""}
      ${i%2===1||i===7?`<text x="${xx+bw/2}" y="${H-7}" text-anchor="middle" class="bax">${i===7?"This wk":wk}</text>`:""}</g>`}).join("");
  return `<svg class="wbars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} per week, last 8 weeks, ${total} total">
    <line x1="0" x2="${W}" y1="${H-bottom}" y2="${H-bottom}" class="bbase"/>${bars}</svg>
    <details class="stable"><summary>Show as table</summary><table><thead><tr><th>Week of</th><th>${esc(label)}</th></tr></thead><tbody>${data.map(x=>`<tr><td>${fmtDate(x.week)}</td><td>${x.n}</td></tr>`).join("")}</tbody></table></details>`;
}

}

/* ---------- Your Week: build a weekday by body part ---------- */
const BODY_PARTS=[["Chest",["Chest"]],["Back",["Back"]],["Shoulders",["Shoulders"]],["Arms",["Biceps","Triceps"]],["Legs",["Quads","Hamstrings","Calves"]],["Glutes",["Glutes"]],["Abs",["Abs","Obliques"]],["Cardio",["Cardio"]],["Full body",["Quads","Chest","Back","Shoulders","Hamstrings","Abs"]]];
const PICKS={Chest:["Barbell Bench Press","Incline Dumbbell Press","Cable Crossover","Chest Press Machine"],
 Back:["Lat Pulldown","Seated Cable Row","One-Arm Dumbbell Row","Pull-Ups"],
 Shoulders:["Seated Dumbbell Shoulder Press","Dumbbell Lateral Raise","Face Pulls","Military Press"],
 Biceps:["EZ-Bar Curl","Hammer Curl","Cable Curl"],Triceps:["Rope Pushdown","Overhead Cable Rope Extension","EZ-Bar Skull Crushers"],
 Quads:["Barbell Back Squat","Leg Press","Leg Extension"],Hamstrings:["Romanian Deadlift","Lying Leg Curl"],Calves:["Standing Calf Raise Machine"],
 Glutes:["Barbell Hip Thrust","Hip Abduction Machine","Cable Glute Kickback"],Abs:["Cable Crunch","Hanging Leg Raises"],Obliques:["Russian Twists"],Cardio:["Incline Treadmill Walk"]};
const WSIZE={fewer:4,normal:6,more:8};
function buildDayFrom(parts,size){
  const n=WSIZE[size]||6; const wantCardio=parts.includes("Cardio"); const lifts=parts.filter(p=>p!=="Cardio");
  const queues=lifts.map(p=>{const groups=(BODY_PARTS.find(b=>b[0]===p)||[0,[]])[1];const q=[];let i=0;
    while(q.length<12&&groups.some(g=>(PICKS[g]||[])[Math.floor(i/groups.length)])){const g=groups[i%groups.length];const name=(PICKS[g]||[])[Math.floor(i/groups.length)];if(name&&!q.includes(name))q.push(name);i++}
    return q});
  const out=[]; const cap=n-(wantCardio&&lifts.length?1:0);
  for(let r=0;out.length<cap&&queues.some(q=>q.length);r++) queues.forEach(q=>{if(out.length<cap&&q.length){const x=q.shift();if(!out.includes(x))out.push(x)}});
  const partOf=(name)=>lifts.findIndex(p=>(BODY_PARTS.find(b=>b[0]===p)||[0,[]])[1].some(g=>(PICKS[g]||[]).includes(name)));
  const sorted=out.map((n,i)=>[n,i]).sort((a,b)=>(partOf(a[0])-partOf(b[0]))||(a[1]-b[1])).map(x=>x[0]);
  if(wantCardio) sorted.push(PICKS.Cardio[0]);
  return sorted.map(name=>LIB.find(x=>x.name===name)).filter(Boolean);
}

 t.textContent=msg;t.hidden=false;clearTimeout(toastH);toastH=setTimeout(()=>t.hidden=true,2200)}

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;if(b.dataset.tab!=="programs")state.builder=null;state.reorder=null;state.stats=null;state.dayMenu=false;state.settings=false;state.tab=b.dataset.tab==="workout"?(defaultDay()||"workout"):b.dataset.tab;ls.set("ll.tab",state.tab);closeSheet();render();window.scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});

render();

/* ---------- account storage (db) ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return bootLocal();
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return bootLocal();
    const id=await u.id(); if(!id) return bootLocal();
    db=d;uid=id;col=db.collection("data/users/"+uid); uCap=u;
    try{startCommunity()}catch(e){console.warn(e)}
    try{u.isOwner().then(v=>{pg.isOwner=!!v})}catch(e){}
    const localLogs=ls.get(LOCAL_KEY,{});
    let first=true;
    col.onSnapshot(snap=>{
      let tplDoc=null;
      const next={};snap.docs.forEach(doc=>{const v=thaw(doc.data());
        if(doc.id==="_template"){tplDoc=v;return}
        if(doc.id==="_plan"&&v){ if(planPending>0) return; if(plan.rev&&(v.rev||0)<plan.rev) return;
          plan=normPlan(v); plan.rev=v.rev||0; ls.set("ll.plan",plan); syncDays(); return}
        if(v&&Array.isArray(v.entries))next[doc.id]={entries:v.entries}});
      Object.keys(logPending).forEach(id=>{if(logPending[id]>0&&state.logs[id])next[id]=state.logs[id]});
      state.logs=next;state.mode="db";
      if(tplDoc&&tplDoc.days) ls.set("ll.tpl",tplDoc);
      if(first){state.loading=false; if(!snap.docs.some(x=>x.id==="_plan")&&!plan.template&&!HAD_LOCAL_PLAN) state.needsStart=true;}
      refreshTemplate();
      if(first){first=false;
        // move anything logged on this phone before sign-in into the account
        if(!snap.docs.some(x=>x.id==="_plan")&&(plan.template||Object.keys(plan.slots).length||plan.customs.length)) savePlan();
        Object.keys(localLogs).forEach(k=>{const have=new Set((next[k]?.entries||[]).map(e=>e.date));
          const add=(localLogs[k].entries||[]).filter(e=>!have.has(e.date));
          if(add.length){state.logs[k]={entries:[...(next[k]?.entries||[]),...add].sort((a,b)=>a.date<b.date?-1:1)};persist(k)}});
      }
      if(!state.open) render(); else {render();}
    },err=>{state.mode="local";loadLocal();bootLocal()});
  }catch(e){bootLocal()}
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
